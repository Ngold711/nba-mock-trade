.board { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); align-items: start; }

.cap-seg { --n: 4; }

.vd-stamp { font: 900 clamp(1.35rem, 6vw, 1.75rem)/1 var(--font-mono); letter-spacing: 0.06em; padding: 0.55rem 0.9rem; border: 4px solid currentColor; border-radius: 0.6rem; transform: rotate(-4deg) scale(1.6); opacity: 0; animation: stamp 420ms cubic-bezier(.2,1.6,.4,1) 120ms forwards; }

@media (prefers-reduced-motion: reduce) { .vd-stamp { animation: none; transform: rotate(-4deg); opacity: 1; } .vd-card { transition: none; } }
.vd-why { margin: 0.2rem 0 0; font-size: 0.9375rem; line-height: 1.5; color: var(--label); }
.vd-more { margin: 0; padding-left: 1.1rem; text-align: left; font-size: 0.8125rem; color: var(--label-2); justify-self: stretch; } .vd-more.warn { color: var(--warn); }
.vd-switch { justify-self: center; }
.vd-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; justify-self: stretch; } .vd-acts .btn { min-height: 44px; } .vd-acts .btn:first-child { grid-column: 1 / -1; }
.vd-acts .btn:disabled { opacity: .4; }
@media (max-width: 999px) { .ai-orb { --orb-lift: 4.4rem; } }
/* 🔥 Most Traded & Rumored */
.trend[hidden] { display: none !important; }

</style>

<body>
<header class="bar" id="bar"></header>

<main>
  <section class="trend" id="trend" aria-label="Most traded and rumored players" hidden>
    <div class="trend-head"><span class="trend-title">🔥 MOST TRADED &amp; RUMORED</span><span class="trend-sub" id="trendSub">Live</span></div>

  </section>
  <div class="page-head">
    <h2>Trade Machine</h2>
    <div class="tools">
      <label class="switch" title="Strict CBA Rules vs. Sandbox Mode"><input type="checkbox" id="strictToggle" checked /><span class="track"></span><span id="strictLabel">Strict CBA Rules</span></label>

<div class="verdict" id="verdict" role="dialog" aria-label="League office verdict" hidden></div>
<div class="dock" id="dock">
  <span class="dot" id="dockDot"></span>

  <button class="btn ghost press" id="dockLink" type="button" aria-label="Copy Trade Link">🔗<span> Copy Trade Link</span></button>
  <button class="btn primary press propose" id="proposeBtn" type="button">PROPOSE TRADE</button>
  <button id="dockCard" type="button" hidden>Share Image Card</button>
</div>

<script src="data.js"></script>
<script type="module">
import { Spring, project, rubberband, tracker, reduceMotion, createSheet, createToast, scrollEdge, springIn, dismissOnBackdrop } from "./ui/motion.js";
import { avatar, esc, teamLogo } from "./ui/avatar.js";
import { createClient } from "./ui/client.js";
import { mountShell } from "./ui/shell.js";
import { resolveSalary, validateTrade, firstRoundHoldings, TIERS, money, encodeTrade, decodeTrade, STEPIEN_YEARS } from "./service/trade.js";
import { renderReceipt } from "./ui/receipt.js";
import { pickGrid } from "./service/draft.js";
import { openImageSheet } from "./ui/card.js";
import { saveFlow } from "./ui/account.js";
import { isScoped, sget, sset } from "./ui/scoped.js";
const shell = mountShell({ active: "trade" });

const D = window.NBA_DATA;
const TEAMS = D.teams;
const ABBRS = Object.keys(TEAMS).sort((a, b) => (TEAMS[a].city + TEAMS[a].name).localeCompare(TEAMS[b].city + TEAMS[b].name));
const CODE_TO_ESPN = { GSW: "GS", NOP: "NO", NYK: "NY", SAS: "SA", UTA: "UTAH", WAS: "WSH" };
const espnAbbr = (c) => CODE_TO_ESPN[c] || c;
const logoUrl = (c) => `https://a.espncdn.com/i/teamlogos/nba/500/${espnAbbr(c).toLowerCase()}.png`;
const $ = (s, r = document) => r.querySelector(s);
const slug = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const haptic = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
// Personal work (the trade workspace) is per user, or in memory only for guests: see ui/scoped.js.
const store = { get(k) { if (isScoped(k)) return sget(k); try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { if (isScoped(k)) return sset(k, v); try { localStorage.setItem(k, v); } catch {} } };
const sheet = createSheet();
const toast = createToast();
scrollEdge($("#bar"));

// Fallback thresholds if salaries_2026_27.json can't load (same projected values as the file).
const FALLBACK_CBA = { salaryCap: 165, taxLine: 201, firstApron: 209, secondApron: 222, matching: { smallMax: 9.1, smallPct: 2, midMax: 35.3, midAdd: 9.1, largePct: 1.25, cushion: 0.25 } };
let BOOK = null, PICKCFG = null;
const STATS = new Map();
const cba = () => BOOK?.cba || FALLBACK_CBA;

/* =====================================================================
   Rosters: live ESPN (served from the service's warm cache), snapshot otherwise.
   ===================================================================== */
const nameKey = (name) => slug(name.replace(/,?\s+(jr|sr|ii|iii|iv)\.?$/i, ""));
const SNAP = new Map();
for (const abbr of Object.keys(TEAMS)) for (const [name, pos, salary, v] of TEAMS[abbr].players) SNAP.set(nameKey(name), { abbr, name, pos, salary, v });
const raw = {};            // abbr -> normalized ESPN roster
const live = {};           // abbr -> { players, season }
const rosterState = {};    // abbr -> "loading" | "live" | "failed"
let client = null, liveSeason = null;

function estimateValue(salaryM, age) {
  let v = salaryM == null ? 60 : 58 + Math.min(salaryM, 55) * 0.45;
  if (age != null && age <= 22) v += 3;
  return Math.max(55, Math.min(85, v));
}
function fromLive(abbr, a) {
  const snap = SNAP.get(nameKey(a.name));
  const r = resolveSalary(a, { book: BOOK, stats: STATS.get(String(a.id)), snapshotSalary: snap?.salary, cba: cba() });
  return {
    id: a.id ? `${abbr}:p${a.id}` : `${abbr}:${slug(a.name)}`, espnId: a.id, slug: slug(a.name), kind: "player", from: abbr, name: a.name, pos: a.position || "—",
    salary: r.salary, salarySource: r.source, age: a.age, experience: a.experience,
    v: snap ? snap.v : estimateValue(r.salary, a.age),
    headshot: a.headshot, headshotSmall: a.headshotSmall, initials: a.initials, injury: a.injury,
  };
}
function fromSnapshot(abbr, [name, pos, salary, v]) {
  return { id: `${abbr}:${slug(name)}`, slug: slug(name), kind: "player", from: abbr, name, pos, salary: Math.round(salary * 1.05 * 100) / 100, salarySource: "estimate", v, headshot: null, headshotSmall: null };
}
function rebuild(abbr) { if (raw[abbr]) live[abbr] = { players: raw[abbr].athletes.map((a) => fromLive(abbr, a)), season: raw[abbr].season }; }
const playerList = (abbr) => (live[abbr] ? live[abbr].players : TEAMS[abbr].players.map((p) => fromSnapshot(abbr, p)));

async function ensureRoster(abbr) {
  if (!client || !abbr || rosterState[abbr] === "loading" || rosterState[abbr] === "live") return;
  rosterState[abbr] = "loading"; paintRosterStatus();
  try {
    const { data } = await client.get("roster", { team: TEAMS[abbr].espn });
    raw[abbr] = data; rebuild(abbr);
    liveSeason = data.season || liveSeason;
    rosterState[abbr] = "live";
    canonicalize(abbr);
  } catch { rosterState[abbr] = "failed"; }
  state.assets = state.assets.filter((a) => !a.id.startsWith(abbr + ":") || findAsset(a.id));
  commit();
}
/** Links and Team Hub use name slugs; once a live roster is in, switch those to ESPN ids. */
function canonicalize(abbr) {
  for (const a of state.assets) {
    const [from, ref] = a.id.split(":");
    if (from !== abbr || /^p\d+$/.test(ref) || /^\d{4}-/.test(ref)) continue;
    const hit = live[abbr]?.players.find((p) => p.slug === ref || nameKey(p.name) === ref);
    if (hit && !state.assets.some((x) => x.id === hit.id)) a.id = hit.id;
  }
}
function paintRosterStatus() {
  const vals = activeTeams().map((t) => rosterState[t]);
  const p = $("#rosterPulse"), l = $("#rosterLabel");
  if (vals.includes("loading")) { p.className = "pulse"; l.textContent = "Loading live rosters…"; }
  else if (vals.length && vals.every((v) => v === "live")) { p.className = "pulse on"; l.textContent = `Live ESPN rosters and 2026–27 contracts. “est.” marks a salary estimated from experience and production (no contract on file). Cap thresholds are projections.`; }
  else if (vals.includes("failed") || !client) { p.className = "pulse err"; l.textContent = `Live rosters unavailable: using the ${D.season} snapshot with estimated 2026–27 salaries.`; }
  else { p.className = "pulse on"; l.textContent = "Live ESPN rosters and 2026–27 contracts."; }
  shell.setStatus(p.className.replace("pulse", "").trim(), p.className.includes("err") ? "Snapshot data" : "Live Sync");
}

/* =====================================================================
   State (auto-saved) + assets
   ===================================================================== */
const SAVE_KEY = "trade:workspace:v1", STRICT_KEY = "trade:strict";
const fresh = () => ({ teams: [null, null], assets: [] });
let state = fresh();
let strict = store.get(STRICT_KEY) !== "0";
const justAdded = new Set();
const collapsed = new Set();

const ord = (r) => (r === 1 ? "1st" : "2nd");
function pickAsset(abbr, year, round, origin = abbr) {
  const via = origin !== abbr;
  return { id: `${abbr}:${year}-${round}${via ? "@" + origin : ""}`, kind: "pick", from: abbr, origin, name: via ? `${year} ${ord(round)} (via ${origin})` : `${year} ${ord(round)}-round pick`, pos: "Pick", salary: 0, v: round === 1 ? 72 - (year - 2027) * 0.5 : 58, year, round };
}
function findAsset(id) {
  const i = id.indexOf(":"); const abbr = id.slice(0, i), ref = id.slice(i + 1);
  if (!TEAMS[abbr]) return null;
  const m = /^(\d{4})-(1|2)(?:@([A-Z]{2,4}))?$/.exec(ref);
  if (m) return +m[1] >= 2027 && +m[1] <= 2029 ? pickAsset(abbr, +m[1], +m[2], m[3] || abbr) : null;
  const list = playerList(abbr);
  const hit = list.find((p) => p.id === id) || list.find((p) => p.slug === ref || nameKey(p.name) === ref);
  if (hit) return hit;
  if (/^p\d+$/.test(ref)) return null;                    // ESPN id: wait for (or prune after) the live roster
  const snap = SNAP.get(ref) || [...SNAP.values()].find((s) => slug(s.name) === ref);
  return snap ? fromSnapshot(abbr, [snap.name, snap.pos, snap.salary, snap.v]) : null;
}
const activeTeams = () => state.teams.filter(Boolean);

function addAsset(asset) {
  if (!asset || state.assets.some((a) => a.id === asset.id)) return;
  const others = activeTeams().filter((t) => t !== asset.from);
  state.assets.push({ id: asset.id, to: others[0] || null });
  justAdded.add(asset.id); haptic(); commit();
  if (asset.kind === "player" && asset.espnId) countAdd(asset.espnId);
}
/* Hooptrax user trade counter → /api/trending-trades (batched, best-effort) */
let addQueue = new Set(), addTimer = 0;
const visitorId = (() => { try { let v = localStorage.getItem("htx:visitor"); if (!v) { v = Math.random().toString(36).slice(2, 14); localStorage.setItem("htx:visitor", v); } return v; } catch { return ""; } })();
function countAdd(espnId) {
  addQueue.add(String(espnId)); clearTimeout(addTimer);
  addTimer = setTimeout(() => {
    const ids = [...addQueue]; addQueue = new Set();
    fetch("/api/trade-adds", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ids, visitor: visitorId }), keepalive: true }).catch(() => {});
  }, 1500);
}
function removeAsset(id) { state.assets = state.assets.filter((a) => a.id !== id); haptic(); commit(); }
function setTeam(slot, abbr) {
  const prev = state.teams[slot];
  state.teams[slot] = abbr;
  if (prev && prev !== abbr) state.assets = state.assets.filter((a) => !a.id.startsWith(prev + ":"));
  fixDestinations(); commit(); ensureRoster(abbr);
}
function removeSlot(slot) {
  const prev = state.teams[slot];
  state.teams.splice(slot, 1);
  if (prev) state.assets = state.assets.filter((a) => !a.id.startsWith(prev + ":"));
  while (state.teams.length < 2) state.teams.push(null);
  fixDestinations(); commit();
}
function fixDestinations() {
  const act = activeTeams();
  state.assets.forEach((a) => { const from = a.id.split(":")[0]; if (!a.to || !act.includes(a.to) || a.to === from) a.to = act.find((t) => t !== from) || null; });
}

/* =====================================================================
   Legality (service/trade.js) + value grades
   ===================================================================== */
function payrollOf(abbr) {
  const dead = BOOK?.teams?.[espnAbbr(abbr)]?.deadMoney || 0;
  if (live[abbr]) return live[abbr].players.reduce((s, p) => s + p.salary, 0) + dead;
  const snapP = BOOK?.teams?.[espnAbbr(abbr)]?.payrollSnapshot;
  return snapP ?? TEAMS[abbr].players.reduce((s, p) => s + p[2] * 1.05, 0);
}
function flows(team) {
  const sends = [], receives = [];
  for (const a of state.assets) {
    const asset = findAsset(a.id); if (!asset) continue;
    if (asset.from === team) sends.push(asset);
    if (a.to === team) receives.push(asset);
  }
  return { sends, receives };
}
let lastV = null;
function validate() {
  const teams = activeTeams().map((abbr) => ({
    abbr, payroll: payrollOf(abbr), rosterCount: live[abbr] ? live[abbr].players.length : null,
    holdings: PICKCFG ? firstRoundHoldings(abbr, PICKCFG) : null, ...flows(abbr),
  }));
  lastV = validateTrade(teams, { cba: cba(), strict });
  return lastV;
}
const worth = (v) => Math.pow(2, (v - 60) / 6);
function grade(team) {
  const { sends, receives } = flows(team);
  if (!sends.length && !receives.length) return "—";
  const vin = receives.reduce((s, a) => s + worth(a.v), 0), vout = sends.reduce((s, a) => s + worth(a.v), 0);
  const r = (vin - vout) / Math.max(vin, vout, 1);
  return [[0.35,"A+"],[0.2,"A"],[0.08,"A−"],[-0.02,"B+"],[-0.1,"B"],[-0.2,"B−"],[-0.3,"C+"],[-0.4,"C"],[-0.5,"C−"],[-0.65,"D"],[-Infinity,"F"]].find(([t]) => r >= t)[1];
}

/* =====================================================================
   Rendering
   ===================================================================== */
const ICON = {
  x: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  check: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.3l2.6 2.6L10 3.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const badge = (abbr) => `<span class="badge" style="--c:${TEAMS[abbr].color}">${abbr}</span>`;
const salaryTxt = (p) => `${money(p.salary)}${p.salarySource === "estimate" ? '<span class="est" title="Estimated: no 2026–27 contract on file">est.</span>' : ""}`;
const assetFace = (asset, size = "2.25rem") => asset.kind === "pick"
  ? `<span class="pick-icon" style="width:${size};height:${size}" aria-hidden="true">${String(asset.year).slice(2)}′</span>`
  : avatar(asset, { size, color: TEAMS[asset.from]?.color });
const tierPill = (k) => `<span class="tier ${k}">${TIERS[k]}</span>`;
let RATINGS = new Map();
const ovrTier = (o) => (o >= 95 ? "gal" : o >= 90 ? "dia" : o >= 85 ? "ame" : o >= 80 ? "rub" : "base");
const ovrOf = (a) => { const r = a.espnId && RATINGS.get(String(a.espnId)); return r ? `<span class="ovr t-${ovrTier(r.ovr)}" title="2K27 OVR${r.seeded ? "" : " (est.)"}">${r.ovr}</span>` : ""; };
/** "2027 1st • Unprotected" style label from the pick-obligation config. */
function pickLabel(a) {
  const base = `${a.year} ${a.round === 1 ? "1st" : "2nd"}`;
  if (a.round === 2) return { head: base, sub: a.origin !== a.from ? `via ${a.origin}` : "Own pick" };
  const cell = PICKCFG ? pickGrid(PICKCFG, [a.origin])[a.origin]?.[String(a.year)] : null;
  const prot = !cell || cell.status === "own" ? "Unprotected" : cell.status === "swap" ? "Swap pool" : cell.status === "protected" ? cell.note.replace(/^To \w+ /, "").replace(/^unless /, "Protected ") : "Unprotected";
  return { head: base, sub: `${a.origin !== a.from ? `via ${a.origin} • ` : ""}${prot}` };
}
/** Visual salary & apron meter: payroll before → after against cap / tax / aprons. */
function apronMeter(r) {
  const c = cba(), max = c.secondApron * 1.12, pc = (v) => `${Math.max(0, Math.min(100, (v / max) * 100)).toFixed(2)}%`;
  const up = r.post >= r.pre;
  return `<div class="wr-meter" title="Payroll ${money(r.pre)} → ${money(r.post)}">
    <div class="wrm-top"><span class="num">${money(r.pre)} → <b>${money(r.post)}</b></span>${r.tierPost !== r.tierPre ? `${tierPill(r.tierPre)}<span class="arr">→</span>${tierPill(r.tierPost)}` : tierPill(r.tierPost)}</div>
    <div class="wrm-bar"><span class="wrm-fill t-${r.tierPost}" style="width:${pc(r.post)}"></span>${!up ? `<span class="wrm-ghost" style="left:${pc(r.post)};width:calc(${pc(r.pre)} - ${pc(r.post)})"></span>` : `<span class="wrm-add" style="left:${pc(r.pre)};width:calc(${pc(r.post)} - ${pc(r.pre)})"></span>`}
      ${[["C", c.salaryCap], ["T", c.taxLine], ["A1", c.firstApron], ["A2", c.secondApron]].map(([l, v]) => `<span class="wrm-mark" style="left:${pc(v)}"><i>${l}</i></span>`).join("")}</div>
    <div class="wrm-flow num"><span>Out ${money(r.out)}</span><span>In ${money(r.inc)}</span><span class="${r.net > 1e-6 ? "up" : r.net < -1e-6 ? "down" : ""}">Net ${money(r.net, { sign: true })}</span>${r.ok ? '<span class="ok">✓</span>' : '<span class="no">✕</span>'}</div>
  </div>`;
}

function renderBanner(v) {

/* Swipe-to-remove: 1:1 tracking, rubber band, momentum projection */
function initSwipe(row) {
  const wrap = row.parentElement, under = wrap.querySelector(".asset-under");
  if (!under) return;
  const sp = new Spring(0, (x) => { row.style.transform = x ? `translateX(${x}px)` : ""; under.style.opacity = x < -1 ? "1" : "0"; });
  let start = null, dragging = false, base = 0;
  const vt = tracker();
  row.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button, select") || e.button !== 0) return;
    sp.stop(); base = sp.x; start = { x: e.clientX, y: e.clientY, id: e.pointerId }; dragging = false; vt.reset(); vt.push(e.clientX);
  });
  row.addEventListener("pointermove", (e) => {
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!dragging) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dy) > Math.abs(dx)) { start = null; return; }
      dragging = true; row.setPointerCapture(e.pointerId);
    }
    vt.push(e.clientX);
    let x = base + dx; if (x > 0) x = rubberband(x, row.offsetWidth);
    sp.set(x);
  });
  const end = (e) => {
    if (!start || e.pointerId !== start.id) return;
    start = null; if (!dragging) return; dragging = false;
    const v = vt.velocity(), w = row.offsetWidth;
    if (sp.x + project(v, 0.99) < -w * 0.45) sp.to(-w - 20, { damping: 1, response: 0.3, velocity: v, onDone: () => { wrap.style.opacity = "0"; removeAsset(row.dataset.asset); } });
    else sp.to(0, { damping: 1, response: 0.35, velocity: v });
  };
  row.addEventListener("pointerup", end); row.addEventListener("pointercancel", end);
}

/* ---------- PROPOSE TRADE → GM verdict stamp ---------- */
const fullName = (abbr) => `${TEAMS[abbr]?.city || ""} ${TEAMS[abbr]?.name || abbr}`.trim();
function officeReason(team, err) {
  const name = fullName(team);
  if (/^Takes back/.test(err)) { const m = /Takes back (\S+) but may only take back (\S+) for (\S+) outgoing\. (\S+) over/.exec(err); return m ? `${name} would take back ${m[1]} for ${m[3]} going out, ${m[4]} over the salary-matching limit (${m[2]}).` : `${name} fails salary matching.`; }
  if (/Apron team can't take back/.test(err)) return `${name} would be over the ${/Second/.test(err) ? "Second" : "First"} Apron and can't take back more salary than it sends.`;
  if (/aggregate/.test(err)) return `${name} is above the Second Apron and can't combine contracts to bring back a bigger salary.`;
  if (/^Stepien/.test(err)) return `Stepien Rule: ${name} would be left without a first-round pick in back-to-back drafts (${(/\(([^)]+)\)/.exec(err) || [])[1] || ""}).`;
  if (/already owed|Doesn't own|Doesn't control/.test(err)) return `${name} doesn't control a pick it's trying to send: ${err.replace(/\.$/, "")}.`;
  return `${name}: ${err}`;
}
function openVerdict() {

  const errs = v.teams.flatMap((t) => t.errors.map((e) => officeReason(t.abbr, e)));

  const why = v.legal
    ? `League office: salaries match under the 2026–27 rules, no apron or Stepien Rule violations. ${v.teams.map((t) => `${TEAMS[t.abbr]?.name} ${money(t.net, { sign: true })}`).join(" · ")}.`
    : strict ? errs[0] : `CBA rules overridden. Under the real rules: ${errs[0]}`;
  const el = $("#verdict");
  el.innerHTML = `<div class="vd-card ${kind}">
    <div class="vd-teams">${v.teams.map((t) => `<span class="vd-team" style="--c:${TEAMS[t.abbr].color}">${badge(t.abbr)}</span>`).join('<span class="vd-x">⇄</span>')}</div>
    <div class="vd-stamp ${kind}">${head}</div>
    <p class="vd-why">${esc(why)}</p>
    ${errs.length > 1 ? `<ul class="vd-more">${errs.slice(1).map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
    ${v.warnings.length ? `<ul class="vd-more warn">${v.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    <label class="switch vd-switch"><input type="checkbox" id="vdSandbox" ${strict ? "" : "checked"} /><span class="track"></span><span>Sandbox Override</span></label>
    <div class="save-row"><button class="btn ghost press" type="button" data-vd="private">🔒 Save Privately</button><button class="btn ghost press" type="button" data-vd="post">🌎 Save &amp; Post</button></div>
    <div class="vd-acts">
      <button class="btn primary press" type="button" data-vd="share" ${approved ? "" : "disabled"}>Share Trade Card</button>
      <button class="btn ghost press" type="button" data-vd="link" ${approved ? "" : "disabled"}>🔗 Copy Link</button>
      <button class="btn ghost press" type="button" data-vd="close">${approved ? "Done" : "Rework Trade"}</button>
    </div></div>`;
  el.hidden = false; requestAnimationFrame(() => el.classList.add("in"));
  el.querySelector("#vdSandbox").addEventListener("change", (e) => { strict = !e.target.checked; store.set(STRICT_KEY, strict ? "1" : "0"); paintStrict(); commit({ save: false }); openVerdict(); });
  el.querySelector('[data-vd="share"]').addEventListener("click", () => { closeVerdict(); $("#dockCard").click(); });

  el.querySelector('[data-vd="post"]').addEventListener("click", () => { closeVerdict(); saveFlow({ type: "trade", visibility: "public", build: tradePayload }); });
  try { navigator.vibrate && navigator.vibrate(approved ? [12, 40, 12] : 30); } catch {}
}
/** The exact trade (teams, players, 2027–29 picks, CBA verdict) for a private save or a community post. */
function tradePayload() {
  const v = validate();
  if (v.status === "incomplete") { toast(v.reasons[0] || "Add players or picks first"); return null; }
  const teams = activeTeams();
  const nm = (a) => findAsset(a.id)?.name || a.id.split(":")[1];
  const lines = teams.map((t) => ({ team: t, gets: state.assets.filter((a) => a.to === t).map(nm) }));
  const kind = v.legal ? "ok" : strict ? "no" : "sbx";
  const head = v.legal ? "✓ TRADE APPROVED" : strict ? "✕ TRADE REJECTED" : "⚡ SANDBOX APPROVED";
  const star = state.assets.map((a) => findAsset(a.id)).filter((a) => a?.kind === "player").sort((a, b) => b.salary - a.salary)[0];
  return {
    title: `${teams.map((t) => TEAMS[t]?.name || t).join(" ⇄ ")}${star ? `: ${star.name} moves` : ""}`.slice(0, 140),
    payload: { trade: encodeTrade(state), teams, assets: state.assets.map(({ id, to }) => ({ id, to })), lines, verdict: { kind, head, legal: !!v.legal, strict: !!strict } },
  };
}
function closeVerdict() { const el = $("#verdict"); el.classList.remove("in"); setTimeout(() => { if (!el.classList.contains("in")) el.hidden = true; }, 180); }
$("#proposeBtn").addEventListener("click", openVerdict);
dismissOnBackdrop($("#verdict"), closeVerdict, { isOpen: () => $("#verdict").classList.contains("in") });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#verdict").hidden) closeVerdict(); });

/* ---------- 🔥 Most Traded & Rumored strip ---------- */
let TREND = [];
async function loadTrending() {
  try {
    const r = await fetch("/api/trending-trades"); if (!r.ok) throw new Error(r.status);
    const { data } = await r.json();
    TREND = (data.players || []).filter((p) => TEAMS[p.team.code]);
    if (!TREND.length) return;
    const live = data.sources?.hoopshype?.ok || data.sources?.espn?.ok;
    $("#trendSub").textContent = live ? `Rumors · news · Hooptrax trades` : "Hooptrax trades";
    $("#trendRow").innerHTML = TREND.map((p) => `<button class="trend-card press" type="button" role="listitem" data-trend="${esc(p.id)}" style="--c:${esc(p.team.color)}" aria-label="#${p.rank} ${esc(p.name)}, ${esc(p.team.name)}, ${money(p.salary)}. Load into the trade machine">
      <span class="tc-rank">#${p.rank}</span>
      <span class="tc-face">${avatar({ name: p.name, headshotSmall: p.headshot }, { size: "2.6rem", color: p.team.color })}<span class="tc-logo">${teamLogo({ abbr: p.team.code, logo: p.team.logo, color: p.team.color }, { size: "1.05rem" })}</span></span>
      <span class="tc-name">${esc(p.name.replace(/^(\S)\S*\s/, "$1. "))}</span>
      <span class="tc-sal num">${money(p.salary)}${p.salaryEstimate ? "*" : ""}</span>
      <span class="tc-heat ${p.heat >= 85 ? "hot" : p.heat >= 55 ? "warm" : ""}">${p.heat >= 85 ? "🔥" : "▲"} ${p.heat}</span>
    </button>`).join("");
    $("#trend").hidden = false;
  } catch {}
}
/** One tap: player's team → Team A, player onto the outgoing block, then pick Team B. */
function loadTrendPlayer(p) {
  const code = p.team.code, id = `${code}:p${p.id}`;
  const keep = state.teams.filter((t) => t && t !== code);
  state.teams = [code, keep[0] || null, ...keep.slice(1, 3)];
  state.assets = state.assets.filter((a) => state.teams.includes(a.id.split(":")[0]));
  if (!state.assets.some((a) => a.id === id)) { state.assets.push({ id, to: null }); justAdded.add(id); }
  fixDestinations(); haptic(); commit();
  ensureRoster(code); countAdd(p.id);
  $("#board").scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "start" });
  toast(state.teams[1] ? `${p.name} is on the block` : `${p.name} is on the block. Now pick Team B`);
}
$("#trendRow").addEventListener("click", (e) => { const b = e.target.closest("[data-trend]"); if (!b) return; const p = TREND.find((x) => x.id === b.dataset.trend); if (p) loadTrendPlayer(p); });
loadTrending();

/* ---------- Load: ?trade= link → legacy #t= hash (Team Hub, Quick-View) → auto-save ---------- */
function decodeLegacyHash() {
  try {
    const p = new URLSearchParams(location.hash.slice(1));
    if (!p.get("t")) return false;
    const teams = p.get("t").split(",").slice(0, 4).map((x) => (TEAMS[x] ? x : null));
    while (teams.length < 2) teams.push(null);
    const assets = (p.get("a") || "").split(";").filter(Boolean).map((s) => { const [id, to] = s.split(">"); return { id, to: TEAMS[to] ? to : null }; })
      .filter((a) => teams.includes(a.id.split(":")[0]));
    state = { teams, assets }; fixDestinations();
    return true;
  } catch { return false; }
}
function hydrate() {
  const q = new URLSearchParams(location.search).get("trade");
  if (q) {
    const t = decodeTrade(q, (c) => !!TEAMS[c]);
    if (t) { state = t; fixDestinations(); history.replaceState(null, "", location.pathname); toast("Trade loaded from link"); return; }
  }
  if (decodeLegacyHash()) { history.replaceState(null, "", location.pathname); return; }
  try { const saved = JSON.parse(store.get(SAVE_KEY) || "null"); if (saved && Array.isArray(saved.teams)) { state = { teams: saved.teams.slice(0, 4), assets: saved.assets || [] }; while (state.teams.length < 2) state.teams.push(null); } } catch {}
}
hydrate();
commit({ save: false });
addEventListener("hashchange", () => {
  if (!location.hash.startsWith("#t=")) return;
  if (sheet.isOpen) sheet.close();
  if (decodeLegacyHash()) { history.replaceState(null, "", location.pathname); commit(); activeTeams().forEach(ensureRoster); window.scrollTo(0, 0); }
});

fetch("salaries_2026_27.json").then((r) => r.json()).then((b) => { BOOK = b; Object.keys(raw).forEach(rebuild); paintRules(); commit({ save: false }); }).catch(() => {});
fetch("draft_picks_2027_2029.json").then((r) => r.json()).then((c) => { PICKCFG = c; commit({ save: false }); }).catch(() => {});
createClient().then((c) => {
  client = c;
  activeTeams().forEach(ensureRoster);
  paintRosterStatus();
  c.get("ratings", {}).then(({ data }) => { RATINGS = new Map(data.players.map((r) => [r.id, r])); commit({ save: false }); }).catch(() => {});
  c.get("players", {}).then(({ data }) => { for (const p of data.players) STATS.set(String(p.id), p.stats); Object.keys(raw).forEach(rebuild); commit({ save: false }); }).catch(() => {});
}).catch(() => {
  activeTeams().forEach((t) => { rosterState[t] = "failed"; });
  state.assets = state.assets.filter((a) => findAsset(a.id));
  commit({ save: false });
});
</script>
