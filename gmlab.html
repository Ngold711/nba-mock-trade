<body>
<header class="bar" id="bar"></header>
<main class="hub-page">
  <h1 class="large-title">GM Lab</h1>
  <p class="hub-lede">Run a front office: build trades, run the lottery, draft, and vote.</p>
  <div class="launch-list">
    <a class="launch press" href="index.html" style="--tint:#F59E0B">
      <span class="launch-ic" aria-hidden="true">⇄</span>
      <span class="launch-t"><b>NBA Trade Machine</b><small>Build 2026–27 CBA deals &amp; check cap rules</small><span class="launch-chip" id="chipTrade"></span></span>
      <span class="chev" aria-hidden="true">›</span></a>
    <a class="launch press" href="draft.html" style="--tint:#10B981">
      <span class="launch-ic" aria-hidden="true">🎲</span>
      <span class="launch-t"><b>3-2-1 Lottery &amp; Mock Draft</b><small>2K envelope reveal &amp; 2027–2029 mock boards</small><span class="launch-chip" id="chipDraft"></span></span>
      <span class="chev" aria-hidden="true">›</span></a>
    <a class="launch press" href="awards.html" style="--tint:#6366F1">
      <span class="launch-ic" aria-hidden="true">🏆</span>
      <span class="launch-t"><b>All-Star Ballot, Awards &amp; 2K27</b><small>Vote starters, track MVP races &amp; live 2K ratings</small><span class="launch-chip" id="chipAwards"></span></span>
      <span class="chev" aria-hidden="true">›</span></a>
  </div>
</main>
<script src="data.js"></script>
<script type="module">
import { mountShell } from "./ui/shell.js";
mountShell({ active: "gmlab" });
const chip = (id, html) => { const el = document.getElementById(id); if (el && html) { el.innerHTML = html; el.classList.add("on"); } };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// quiet live previews: one line each, never blocking the hub
fetch("/api/trending-trades").then((r) => r.json()).then(({ data }) => { const p = data?.players?.[0]; if (p) chip("chipTrade", `🔥 Most rumored: ${esc(p.name)} (${esc(p.team.code)})`); }).catch(() => {});
fetch("/api/standings").then((r) => r.json()).then(({ data }) => {
  const all = (data?.conferences || []).flatMap((c) => c.teams || []);
  const worst = all.filter((t) => t.wins + t.losses > 0).sort((a, b) => a.wins / (a.wins + a.losses) - b.wins / (b.wins + b.losses))[0];
  if (worst) chip("chipDraft", `Worst record: ${esc(worst.team.displayName || worst.team.abbr)} ${worst.wins}-${worst.losses}`);
}).catch(() => {});
fetch("/api/2k-ratings").then((r) => r.json()).then(({ data }) => { const p = data?.players?.[0]; if (p) chip("chipAwards", `2K27 #1: ${esc(p.name)} · ${p.ovr}`); }).catch(() => {});
</script>
