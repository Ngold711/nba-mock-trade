<style>
main { max-width: 72rem; margin: 0 auto; padding: 0 max(1rem, env(safe-area-inset-right)) 3rem max(1rem, env(safe-area-inset-left)); }
.toolbar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; padding: 1.25rem 0 1rem; }
.toolbar h2 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.5rem); line-height: 1.05; letter-spacing: -0.026em; font-weight: 750; flex: 1; min-width: 10rem; }
.tabs { --n: 5; width: min(100%, 30rem); }
.tabs button { font-size: 0.8125rem; padding: 0.4rem 0.25rem; }
@media (max-width: 420px) { .tabs button { font-size: 0.75rem; padding: 0.4rem 0.1rem; } }
.feed { display: grid; gap: 0.75rem; padding: 0 0 1rem; }
.feed-filters { display: flex; gap: 0.4rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.1rem; }
.feed-filters::-webkit-scrollbar { display: none; }
.feed-filters button { flex: none; border: 0; border-radius: 999px; min-height: 36px; padding: 0 0.85rem; background: var(--fill); color: var(--label-2); font-weight: 650; font-size: 0.8125rem; cursor: pointer; }
.feed-filters button[aria-selected="true"] { background: #F59E0B; color: #0B0E14; }
.feed-list { display: grid; gap: 0.7rem; }
.post { border-radius: var(--r-lg, 1rem); padding: 0.85rem 0.9rem 0.75rem; background: var(--surface); box-shadow: inset 0 0 0 0.5px var(--sep); display: grid; gap: 0.5rem; }
.post-head { display: flex; align-items: center; gap: 0.55rem; }
.post-by { flex: 1; min-width: 0; display: grid; } .post-by b { font-size: 0.875rem; overflow: hidden; text-overflow: ellipsis; } .post-by small { color: var(--label-3); font-size: 0.75rem; }
.post-title { margin: 0; font-size: 1rem; letter-spacing: -0.01em; }
.post-foot { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.2rem; }
.vote { border: 0; border-radius: 999px; min-height: 38px; min-width: 3.6rem; padding: 0 0.75rem; background: var(--fill); color: var(--label-2); font-weight: 800; cursor: pointer; }
.vote[aria-pressed="true"] { background: rgba(245,158,11,.18); color: #F59E0B; box-shadow: inset 0 0 0 1px rgba(245,158,11,.5); }
.post-open { margin-left: auto; min-height: 38px; text-decoration: none; display: inline-flex; align-items: center; font-size: 0.8125rem; }
.feed-more { justify-self: center; min-height: 40px; }
.feed-more[hidden] { display: none; }
.feed-empty { display: grid; gap: 0.4rem; justify-items: center; text-align: center; padding: 1.5rem 1rem; }
.feed-empty span { color: var(--label-3); font-size: 0.875rem; }
.status-line { font-size: 0.8125rem; color: var(--label-2); display: flex; align-items: center; gap: 0.4rem; }
.err-banner { display: flex; gap: 0.6rem; align-items: center; padding: 0.7rem 0.9rem; border-radius: var(--r-md); background: var(--warn-soft); color: var(--warn); font-size: 0.875rem; font-weight: 550; margin-bottom: 1rem; }
.view[hidden] { display: none; }

/* Games */
.datebar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
.datebar .d { font-weight: 650; font-size: 1.0625rem; letter-spacing: -0.012em; min-width: 9rem; text-align: center; }
.datebar .today { margin-left: auto; }
.games { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); }
.game { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border-radius: var(--r-lg); padding: 0.9rem 1rem; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 0.55rem; min-width: 0; }
.game:hover { box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--sep); }
.game:focus-visible { outline: 3px solid var(--focus); }
.g-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--label-2); }
.g-top .bc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-team { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.65rem; }
.g-team .nm { font-weight: 650; letter-spacing: -0.012em; }
.g-team .rec { font-size: 0.75rem; color: var(--label-3); margin-left: 0.35rem; font-weight: 500; }
.g-team .sc { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.g-team.lose .sc, .g-team.lose .nm { color: var(--label-3); }
.g-lead { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; border-top: 0.5px solid var(--sep); padding-top: 0.6rem; }
.lead { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.lead .t { min-width: 0; font-size: 0.75rem; line-height: 1.3; }
.lead .t b { display: block; font-size: 0.8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.005em; }
.lead .t span { color: var(--label-2); }

/* Tables */
.panel { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 0.5rem 0 0.25rem; min-width: 0; }
.panel h3 { margin: 0.5rem 1rem 0.25rem; font-size: 1.125rem; letter-spacing: -0.016em; }
.panel .note { margin: 0 1rem 0.5rem; font-size: 0.75rem; color: var(--label-3); }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
th { text-align: right; font-weight: 600; font-size: 0.6875rem; color: var(--label-3); letter-spacing: 0.04em; text-transform: uppercase; padding: 0.4rem 0.5rem; white-space: nowrap; }
td { text-align: right; padding: 0.45rem 0.5rem; white-space: nowrap; border-top: 0.5px solid var(--sep); }
th:first-child, td:first-child { text-align: left; padding-left: 1rem; position: sticky; left: 0; background: var(--surface); z-index: 1; }
th:last-child, td:last-child { padding-right: 1rem; }
tr.cut td { border-top: 1.5px dashed var(--fill-strong); }
.who { display: flex; align-items: center; gap: 0.6rem; min-width: 10.5rem; }
.who .nm { font-weight: 600; letter-spacing: -0.008em; }
.who .sub { color: var(--label-3); font-size: 0.6875rem; }
.seed { color: var(--label-3); width: 1.25rem; display: inline-block; font-weight: 600; }
.standings { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* Injuries / moves */
.filters { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
.filters .seg { --n: 4; width: min(100%, 22rem); }
.filters .search { margin: 0; flex: 1; min-width: 12rem; background-color: var(--surface); }
.groups { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); align-items: start; }
.group { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 0.75rem 0.75rem 0.25rem; min-width: 0; }
.group-head { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.25rem 0.4rem; font-weight: 650; letter-spacing: -0.012em; }
.group-head .count { margin-left: auto; font-size: 0.75rem; color: var(--label-3); font-weight: 500; }
.inj .meta .sub { white-space: normal; }
.inj .cmt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--label-3); font-size: 0.75rem; margin-top: 0.15rem; }
.inj { align-items: flex-start; }
.inj .pill { margin-top: 0.15rem; }
.moves .row { align-items: flex-start; }
.moves .when { font-size: 0.6875rem; color: var(--label-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.moves .desc { font-size: 0.9375rem; line-height: 1.4; }

/* Box score sheet */
.box-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.5rem; padding: 0.25rem 0 0.75rem; }
.box-team { display: flex; align-items: center; gap: 0.6rem; }
.box-team.home { flex-direction: row-reverse; text-align: right; }
.box-team .sc { font-size: 2rem; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.box-team .ab { font-size: 0.8125rem; font-weight: 600; color: var(--label-2); }
.box-mid { text-align: center; font-size: 0.75rem; color: var(--label-2); font-weight: 600; }
.box-seg { --n: 2; margin: 0.25rem 0 0.5rem; }
.box-seg button { font-size: 0.8125rem; padding: 0.35rem; }
.sheet .panel { box-shadow: none; padding: 0; background: transparent; }
.sheet th:first-child, .sheet td:first-child { background: var(--surface); padding-left: 0; }
.sheet th:last-child, .sheet td:last-child { padding-right: 0; }
.starter-tag { font-size: 0.625rem; color: var(--accent); font-weight: 700; margin-left: 0.3rem; }
.dnp { font-size: 0.75rem; color: var(--label-3); padding: 0.5rem 0; line-height: 1.6; }
.plays .row { padding: 0.45rem 0; gap: 0.6rem; }
.plays .clk { font-size: 0.6875rem; color: var(--label-3); width: 3.4rem; flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }
.plays .txt { flex: 1; font-size: 0.8125rem; }
.plays .scr { font-size: 0.75rem; font-variant-numeric: tabular-nums; color: var(--label-2); font-weight: 600; }
.plays .row.scoring .txt { font-weight: 600; }
.skeleton { height: 7.5rem; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-sm); opacity: .6; }
.fine { color: var(--label-3); font-size: 0.75rem; margin-top: 2rem; line-height: 1.5; }
@media (max-width: 30rem) { .brand p .long { display: none; } }
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: 1.5rem; align-items: start; }
.dash-main { min-width: 0; }
.dash-rail { position: sticky; top: calc(env(safe-area-inset-top) + 5.5rem); padding-top: 1.25rem; }
.dash-rail .wire { height: calc(100vh - 8rem); max-height: 52rem; }
@media (max-width: 64rem) {
  .dash { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .dash-rail { position: static; order: -1; padding-top: 1rem; }
  .dash-rail .wire { height: 16rem; }
}
.wire-detail p { margin: .25rem 0 .75rem; font-size: .9375rem; line-height: 1.5; }
.wire-detail .meta { color: var(--label-2); font-size: .8125rem; }

/* Game Center */
.ls-wrap { overflow-x: auto; margin: 0.25rem 0 0.75rem; }
.ls { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
.ls th { font-size: 0.625rem; font-weight: 700; color: var(--label-3); letter-spacing: 0.06em; padding: 0.3rem 0.4rem; text-align: center; }
.ls td { padding: 0.35rem 0.4rem; text-align: center; border-top: 1px solid var(--hair); }
.ls .ls-t { text-align: left; display: flex; align-items: center; gap: 0.35rem; font-family: var(--font-sans); font-weight: 650; }
.ls .ls-tot { font-weight: 800; }
.gc-tabs { margin: 0.25rem 0 0.75rem; } .gc-tabs button { font-size: 0.8125rem; padding: 0.45rem 0.2rem; min-height: 40px; }
.ts-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.875rem; margin-bottom: 0.4rem; }
.ts-head span { display: inline-flex; align-items: center; gap: 0.4rem; }
.ts { display: grid; gap: 0.3rem; }
.ts-row { display: grid; grid-template-columns: 1fr 1.4fr 1fr; align-items: center; gap: 0.5rem; padding: 0.4rem 0.5rem; border-radius: 0.6rem; background: var(--surface-2); }
.ts-v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 650; text-align: center; border-radius: 0.45rem; padding: 0.1rem 0; }
.ts-v small { display: block; font-size: 0.625rem; color: var(--label-3); font-weight: 500; }
.ts-v.win { color: var(--good); background: var(--good-soft); }
.ts-l { font-size: 0.75rem; color: var(--label-2); text-align: center; display: grid; gap: 0.25rem; justify-items: center; }
.ts-bar { display: flex; width: 100%; max-width: 8rem; height: 0.3rem; border-radius: 99px; overflow: hidden; gap: 2px; }
.ts-bar i { display: block; height: 100%; }
.plays .pb-logo { width: 1.3rem; flex: none; }
.box-seg { --n: 2; }

/* League Leaders Snapshot */
.snap { margin-top: 1.25rem; padding: 0.9rem 0.9rem 0.75rem; border-radius: var(--r-lg, 1rem); background: var(--surface); box-shadow: inset 0 0 0 0.5px var(--sep); }
.snap-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.6rem; }
.snap-head h3 { margin: 0; font-size: 1.0625rem; letter-spacing: -0.01em; }
.snap-sub { font-size: 0.75rem; color: var(--label-3); }
.snap-cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.25rem; padding: 0.2rem; border-radius: 0.7rem; background: var(--fill); margin-bottom: 0.4rem; }
.snap-cats button { border: 0; background: none; color: var(--label-2); border-radius: 0.55rem; min-height: 34px; font-weight: 650; font-size: 0.8125rem; cursor: pointer; }
.snap-cats button[aria-selected="true"] { background: var(--surface); color: var(--label); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.snap-list { list-style: none; margin: 0; padding: 0; }
.snap-list li + li { border-top: 0.5px solid var(--sep); }
.snap-row { width: 100%; border: 0; background: none; color: var(--label); display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0.15rem; cursor: pointer; text-align: left; font: inherit; min-height: 52px; }
.snap-rank { width: 1.1rem; text-align: center; color: var(--label-3); font-weight: 750; font-size: 0.875rem; }
.snap-list li:first-child .snap-rank { color: #F59E0B; }
.snap-who { flex: 1; min-width: 0; display: grid; } .snap-who b { font-size: 0.9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .snap-who small { color: var(--label-3); font-size: 0.75rem; }
.snap-v { font-size: 1.1rem; font-weight: 800; }
.snap-all { width: 100%; margin-top: 0.4rem; border: 0; border-radius: 0.8rem; min-height: 44px; background: var(--fill); color: var(--accent); font-weight: 700; font-size: 0.9375rem; cursor: pointer; }
.snap-all:hover { background: var(--fill-strong); }
.snap-list .sk-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; }
/* Stat Leaders */
.leaders { margin-top: 1.75rem; }
.ld-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.ld-head h3 { margin: 0; font-size: 1.25rem; letter-spacing: -0.02em; }
.ld-modes { width: 17rem; } .ld-modes button { font-size: 0.8125rem; padding: 0.4rem 0.2rem; }
.ld-panel { margin-top: 0.75rem; }
.ld-list { list-style: none; margin: 0; padding: 0.25rem 0.5rem; }
.ld-list li + li { border-top: 1px solid var(--hair); }
.ld-row { width: 100%; display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0.4rem; background: none; border: 0; cursor: pointer; text-align: left; color: var(--label); border-radius: var(--r-md); }
.ld-row:hover { background: var(--fill); }
.ld-rank { width: 1.5rem; text-align: right; color: var(--label-3); font-size: 0.8125rem; }
.ld-who { flex: 1; min-width: 0; } .ld-who b { display: block; font-size: 0.9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ld-who span { font-size: 0.75rem; color: var(--label-2); }
.ld-v { font-weight: 750; font-size: 1.0625rem; text-align: right; } .ld-v small { display: block; font-size: 0.625rem; color: var(--label-3); font-weight: 600; }
/* Team efficiency in Game Center */
.eff-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: -0.25rem 0 0.75rem; }
.eff-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; font-size: 0.6875rem; color: var(--label-2); }
.eff-row .eff-chips:last-child { justify-content: flex-end; }
.eff-chips span { background: var(--surface-2); border: 1px solid var(--hair); border-radius: 99px; padding: 0.15rem 0.45rem; white-space: nowrap; font-family: var(--font-mono); }
.eff-chips b { color: var(--label); } .eff-chips .pos b { color: var(--good); } .eff-chips .neg b { color: var(--bad); }
</style>

<body>
<header class="bar" id="bar"></header>

<main>
  <div id="ledBoard"></div>
  <div class="toolbar">
    <h2 id="viewTitle">Games</h2>
    <div class="seg tabs" role="tablist" aria-label="View" id="tabs">
      <span class="thumb"></span>
      <button type="button" role="tab" data-view="games">Games</button>
      <button type="button" role="tab" data-view="standings">Standings</button>
      <button type="button" role="tab" data-view="injuries">Injuries</button>
      <button type="button" role="tab" data-view="moves">Moves</button>
      <button type="button" role="tab" data-view="feed">Feed</button>
    </div>
  </div>
  <div id="banner"></div>

  <section class="view" id="view-games">
    <div class="datebar">
      <button class="icon-btn press" type="button" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 12 12"><path d="M7.5 2.5L4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="d" id="dayLabel">Today</span>
      <button class="icon-btn press" type="button" id="nextDay" aria-label="Next day"><svg viewBox="0 0 12 12"><path d="M4.5 2.5L8 6 4.5 9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn press today" type="button" id="todayBtn" hidden>Today</button>
    </div>
    <div class="games" id="games"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    <section class="leaders" id="leaders" aria-label="Stat leaders"></section>
  </section>
  <section class="view" id="view-standings" hidden><div class="standings" id="standings"></div></section>
  <section class="view" id="view-injuries" hidden>
    <div class="filters">
      <div class="seg" id="injFilter" role="group" aria-label="Status">
        <span class="thumb"></span>
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="Out" aria-pressed="false">Out</button>
        <button type="button" data-f="Day-To-Day" aria-pressed="false">Day-to-day</button>
        <button type="button" data-f="other" aria-pressed="false">Other</button>
      </div>
      <input class="search" id="injSearch" type="search" placeholder="Search players or teams" autocomplete="off" />
    </div>
    <div class="groups" id="injuries"></div>
  </section>
  <section class="view" id="view-feed" hidden><div class="feed" id="feed"></div></section>
  <section class="view" id="view-moves" hidden><div class="panel moves"><ul class="list" id="moves" style="padding:0 1rem"></ul></div></section>

  <p class="fine">Data from ESPN’s public feeds, refreshed every 20 seconds while games are live and every 15–60 minutes for standings, injuries and rosters. Player photos are served by ESPN’s image CDN; players without one show their initials. Not affiliated with the NBA or ESPN.</p>
</main>

<script type="module">
import { startFeed } from "./ui/feed.js";
import { createClient } from "./ui/client.js";
import { avatar, teamLogo, esc } from "./ui/avatar.js";
import { Spring, createSheet, scrollEdge, springIn } from "./ui/motion.js";
import { mountShell } from "./ui/shell.js";
import { mountLedBoard } from "./ui/ledboard.js";
import { advanced, inMode } from "./service/advanced.js";
import { CONF_OF } from "./service/allstar.js";
const shell = mountShell({ active: "live" });

const $ = (s, r = document) => r.querySelector(s);
let client = { mode: "direct" };   // replaced once detection finishes (no top-level await: iOS 14 lacks it)
const sheet = createSheet();
scrollEdge($("#bar"));

/* ---------- sync status ---------- */
const sync = { at: 0, live: 0, error: null, stale: false };
function ago(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  return s < 10 ? "just now" : s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`;
}
function paintSync() {
  const p = $("#pulse");
  p.className = "pulse " + (sync.error ? "err" : sync.live ? "live" : sync.at ? "on" : "");
  const src = client.mode === "service" ? "local service" : "ESPN direct";
  $("#sync").innerHTML = sync.error && !sync.at ? "Can’t reach ESPN"
    : `${sync.live ? `${sync.live} live · ` : ""}Updated ${sync.at ? ago(sync.at) : "—"}<span class="long"> · ${src}</span>`;
}
setInterval(paintSync, 5000);
function noteMeta(meta) {
  sync.at = meta?.fetchedAt ? Date.parse(meta.fetchedAt) : Date.now();
  sync.error = meta?.error || null;
  $("#banner").innerHTML = meta?.error
    ? `<div class="err-banner">Couldn’t refresh from ESPN (${esc(meta.error)}). Showing data from ${ago(sync.at)}; retrying automatically.</div>` : "";
  paintSync();
}
function noteError(err, target) {
  sync.error = err.message; paintSync();
  const hint = client.mode === "direct" ? " ESPN sometimes refuses requests made straight from a browser; run the local service (npm start) for reliable data." : "";
  if (target && !target.dataset.loaded) target.innerHTML = `<div class="empty">Couldn’t load this from ESPN: ${esc(err.message)}. Retrying automatically.${hint}</div>`;
}

/* ---------- formatting ---------- */
const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
const fmtDay = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString([], { month: "short", day: "numeric" }); };
const ymd = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
const parseYmd = (s) => new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));

function statusPill(g) {
  const s = g.status;
  if (s.state === "in") return `<span class="pill live"><span class="pulse live"></span>${esc(s.shortDetail || `Q${s.period} ${s.clock}`)}</span>`;
  if (s.state === "pre") return `<span class="pill">${esc(fmtTime(g.date) || s.shortDetail)}</span>`;
  return `<span class="pill">${esc(s.shortDetail || "Final")}</span>`;
}

/* ---------- views ---------- */
const VIEWS = ["games", "standings", "injuries", "moves", "feed"];
const TITLES = { games: "Games", standings: "Standings", injuries: "Injury report", moves: "Transactions", feed: "Community Feed" };
let current = null, stopView = null;
const tabs = $("#tabs");
const tabThumb = new Spring(0, (x) => { tabs.querySelector(".thumb").style.transform = `translateX(${x * 100}%)`; }, 0.001);

function show(view, animate = true) {
  if (!VIEWS.includes(view)) view = "games";
  if (view === current) return;
  stopView?.(); stopView = null;
  current = view;
  VIEWS.forEach((v) => { $(`#view-${v}`).hidden = v !== view; });
  tabs.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  tabs.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  const i = VIEWS.indexOf(view);
  animate ? tabThumb.to(i, { damping: 1, response: 0.3 }) : tabThumb.set(i);
  $("#viewTitle").textContent = TITLES[view];
  $("#banner").innerHTML = "";
  stopView = ({ games: startGames, standings: startStandings, injuries: startInjuries, moves: startMoves, feed: () => startFeed($("#feed")) })[view]();
}
tabs.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.view; });
addEventListener("hashchange", () => show(location.hash.slice(1)));

/* Games */
let day = null; // null = ESPN's current day
function startGames() {
  const el = $("#games");
  el.dataset.loaded = "";
  const stop = client.watch("scoreboard", day ? { date: day } : {}, (sb, meta) => {
    noteMeta(meta);
    sync.live = sb.live;
    paintSync();
    const shown = sb.date ? sb.date.replace(/-/g, "") : day;
    el.dataset.day = shown || "";
    $("#dayLabel").textContent = shown ? parseYmd(shown).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) : "Today";
    $("#todayBtn").hidden = !day;
    const first = !el.dataset.loaded;
    el.dataset.loaded = "1";
    if (!sb.games.length) { el.innerHTML = `<div class="empty">No games scheduled.</div>`; return; }
    const order = { in: 0, pre: 1, post: 2, unknown: 3 };
    const games = [...sb.games].sort((a, b) => order[a.status.state] - order[b.status.state] || a.date.localeCompare(b.date));
    el.innerHTML = games.map(gameCard).join("");
    if (first) el.querySelectorAll(".game").forEach(springIn);
    if (sheet.isOpen && openGame) sheet.refresh();
  }, (err) => noteError(err, el));
  return () => { stop(); sync.live = 0; };
}
function gameCard(g) {
  const teams = [g.away, g.home].filter(Boolean);
  const final = g.status.state === "post";
  const row = (t) => {
    const lose = final && teams.some((o) => o !== t && (o.score ?? 0) > (t.score ?? 0));
    return `<div class="g-team${lose ? " lose" : ""}">${teamLogo(t, { size: "2rem" })}
      <span><span class="nm">${esc(t.name || t.abbr)}</span><span class="rec">${esc(t.record)}</span></span>
      <span class="sc">${g.status.state === "pre" || t.score == null ? "" : t.score}</span></div>`;
  };
  const lead = (t) => {
    const l = t.leaders.find((x) => /^pts$|points/i.test(x.category)) || t.leaders[0];
    if (!l) return `<div></div>`;
    return `<div class="lead">${avatar(l.athlete, { size: "2.25rem", color: t.color })}
      <span class="t"><b>${esc(l.athlete.shortName)}</b><span>${esc(l.value)} ${esc(l.category.toLowerCase())} · ${esc(t.abbr)}</span></span></div>`;
  };
  return `<button class="game press" type="button" data-game="${esc(g.id)}" aria-label="${esc(g.name)}, ${esc(g.status.shortDetail)}">
    <div class="g-top">${statusPill(g)}<span class="bc">${esc(g.broadcast || g.note)}</span></div>
    ${teams.map(row).join("")}
    ${teams.some((t) => t.leaders.length) ? `<div class="g-lead">${teams.map(lead).join("")}</div>` : ""}
  </button>`;
}
$("#games").addEventListener("click", (e) => { const b = e.target.closest("[data-game]"); if (b) openBox(b.dataset.game); });
function shiftDay(n) {
  const base = $("#games").dataset.day || ymd(new Date());
  const d = parseYmd(base); d.setDate(d.getDate() + n);
  day = ymd(d);
  current = null; show("games");
}
$("#prevDay").addEventListener("click", () => shiftDay(-1));
$("#nextDay").addEventListener("click", () => shiftDay(1));
$("#todayBtn").addEventListener("click", () => { day = null; current = null; show("games"); });

/* Stat Leaders explorer (Basketball Reference-style) + team efficiency for Game Center */
let eff = null;                                   // /api/team-stats efficiency, keyed by ESPN abbr
let leadersData = null;
const LD = { cat: "pts", conf: "All", mode: "pergame" };
try { Object.assign(LD, JSON.parse(localStorage.getItem("live:leaders") || "{}")); } catch {}
const LD_CATS = [["pts", "PPG", "PTS"], ["reb", "RPG", "REB"], ["ast", "APG", "AST"], ["stl", "SPG", "STL"], ["blk", "BPG", "BLK"], ["tpm", "3PM", "3PM"], ["ts", "TS%", "TS%"], ["gmsc", "Game Score", "GmSc"]];
const LD_MODES = [["pergame", "Per Game"], ["per36", "Per 36"], ["totals", "Totals"]];
function leaderValue(p, cat, mode) {
  const s = p.stats; if (!s) return null;
  if (cat === "ts") { const a = advanced(s); return a?.ts != null ? a.ts * 100 : null; }
  if (cat === "gmsc") { const g = advanced(s)?.gmsc; if (g == null) return null; return mode === "totals" ? g * s.gp : mode === "per36" ? (s.min ? g * 36 / s.min : null) : g; }
  const m = inMode(s, mode); return m?.[cat] ?? null;
}
/* League Leaders Snapshot: top 5 for one stat, per game, whole league; the full table opens in a sheet. */
const SNAP_CATS = [["pts", "PPG"], ["reb", "RPG"], ["ast", "APG"], ["tpm", "3PM"], ["ts", "TS%"]];
function leaderRows(cat, mode, conf, n) {
  const maxGp = Math.max(1, ...leadersData.players.map((p) => p.stats.gp || 0));
  return leadersData.players.filter((p) => {
    const s = p.stats; if (!s?.gp) return false;
    if (conf !== "All" && CONF_OF[p.teamAbbr] !== conf) return false;
    if (mode === "totals") return true;
    if (s.gp < Math.max(2, Math.ceil(maxGp * 0.5))) return false;
    if (mode === "per36" && s.min < 15) return false;
    if (cat === "ts" && (s.fga || 0) < 6) return false;
    return true;
  }).map((p) => ({ p, v: leaderValue(p, cat, mode) })).filter((r) => r.v != null).sort((a, b) => b.v - a.v).slice(0, n);
}
function renderLeaders() {
  const el = $("#leaders"); if (!el) return;
  const cat = SNAP_CATS.some(([k]) => k === LD.cat) ? LD.cat : "pts";
  const rows = leadersData ? leaderRows(cat, "pergame", "All", 5) : null;
  el.innerHTML = `<div class="snap card-group">
      <div class="snap-head"><h3>League Leaders</h3><span class="snap-sub">Per game · qualified</span></div>
      <div class="snap-cats" role="tablist">${SNAP_CATS.map(([k, l]) => `<button type="button" role="tab" data-snap="${k}" aria-selected="${cat === k}">${l}</button>`).join("")}</div>
      <ol class="snap-list">${rows == null ? Array.from({ length: 5 }, () => `<li class="sk-row"><div class="sk c"></div><div class="sk-l"><div class="sk t"></div></div><div class="sk n"></div></li>`).join("")
        : rows.map(({ p, v }, i) => `<li><button class="snap-row" type="button" data-player="${esc(p.id)}"><span class="snap-rank num">${i + 1}</span>${avatar(p, { size: "2.1rem", color: "#64748B" })}
          <span class="snap-who"><b>${esc(p.name)}</b><small>${esc(p.teamAbbr)} · ${p.stats.gp} GP</small></span><span class="snap-v num">${v.toFixed(1)}</span></button></li>`).join("") || `<li class="empty">No qualified players yet.</li>`}</ol>
      <button class="snap-all press" type="button" data-full-board>View Full Leaderboard <span aria-hidden="true">→</span></button>
    </div>`;
  el.querySelectorAll("[data-snap]").forEach((b) => b.addEventListener("click", () => { LD.cat = b.dataset.snap; saveLd(); renderLeaders(); }));
  el.querySelector("[data-full-board]").addEventListener("click", () => sheet.open({ title: "League Leaders", render(body) { renderLeaderboard(body); } }));
}
function renderLeaderboard(el) {
  if (!el) return;
  const head = `<div class="ld-head">
      <div class="seg ld-modes" style="--n:3"><span class="thumb" style="transform:translateX(${LD_MODES.findIndex(([k]) => k === LD.mode) * 100}%)"></span>${LD_MODES.map(([k, l]) => `<button type="button" data-ldmode="${k}" aria-pressed="${LD.mode === k}">${l}</button>`).join("")}</div></div>
    <div class="pills" data-ldk="cat">${LD_CATS.map(([k, l]) => `<button type="button" data-v="${k}" aria-pressed="${LD.cat === k}">${l}</button>`).join("")}</div>
    <div class="pills" data-ldk="conf" style="margin-top:.4rem">${["All", "East", "West"].map((c) => `<button type="button" data-v="${c}" aria-pressed="${LD.conf === c}">${c}</button>`).join("")}</div>`;
  if (!leadersData) { el.innerHTML = head + `<div class="panel" style="margin-top:.6rem">${Array.from({ length: 6 }, () => `<div class="sk-row" style="padding:.6rem 1rem"><div class="sk c"></div><div class="sk-l"><div class="sk t"></div><div class="sk t s"></div></div><div class="sk n"></div></div>`).join("")}</div>`; }
  else {
    const maxGp = Math.max(1, ...leadersData.players.map((p) => p.stats.gp || 0));
    const cat = LD_CATS.find(([k]) => k === LD.cat);
    const qualified = leadersData.players.filter((p) => {
      const s = p.stats; if (!s?.gp) return false;
      if (LD.conf !== "All" && CONF_OF[p.teamAbbr] !== LD.conf) return false;
      if (LD.mode === "totals") return true;
      if (s.gp < Math.max(2, Math.ceil(maxGp * 0.5))) return false;                      // half the games, like a qualifier
      if (LD.mode === "per36" && s.min < 15) return false;
      if (LD.cat === "ts" && (s.fga || 0) < 6) return false;
      return true;
    });
    const rows = qualified.map((p) => ({ p, v: leaderValue(p, LD.cat, LD.mode) })).filter((r) => r.v != null).sort((a, b) => b.v - a.v).slice(0, 25);
    const fmtv = (v) => (LD.mode === "totals" && !["ts"].includes(LD.cat) ? Math.round(v).toLocaleString() : v.toFixed(1));
    el.innerHTML = head + `<div class="panel ld-panel"><ol class="ld-list">${rows.map(({ p, v }, i) => `<li><button class="ld-row" type="button" data-player="${esc(p.id)}">
        <span class="ld-rank num">${i + 1}</span>${avatar(p, { size: "2.25rem", color: "#64748B" })}
        <span class="ld-who"><b>${esc(p.name)}</b><span>${esc(p.teamAbbr)} · ${p.stats.gp} GP · ${p.stats.min.toFixed(1)} MIN</span></span>
        <span class="ld-v num">${fmtv(v)}<small>${LD.mode === "per36" ? `${cat[2]}/36` : LD.mode === "totals" ? cat[2] : cat[1]}</small></span></button></li>`).join("") || `<li class="empty">No qualified players yet.</li>`}</ol>
      <p class="fine" style="padding:0 1rem .75rem;margin:0">Qualified: half of the max games played${LD.mode === "per36" ? ", 15+ MIN" : ""}${LD.cat === "ts" ? ", 6+ FGA" : ""}. TS% = PTS ÷ (2 × (FGA + 0.44 × FTA)). Game Score is Hollinger's, with total rebounds weighted 0.4 (ESPN's feed has no OREB/DREB split per player).</p></div>`;
  }
  el.querySelectorAll("[data-ldmode]").forEach((b) => b.addEventListener("click", () => { LD.mode = b.dataset.ldmode; saveLd(); renderLeaderboard(el); renderLeaders(); }));
  el.querySelectorAll("[data-ldk] [data-v]").forEach((b) => b.addEventListener("click", () => { LD[b.parentElement.dataset.ldk] = b.dataset.v; saveLd(); renderLeaderboard(el); renderLeaders(); }));
}
const saveLd = () => { try { localStorage.setItem("live:leaders", JSON.stringify(LD)); } catch {} };
function effChips(t) {
  const e = eff?.[t?.abbr]; if (!e) return "";
  const rk = (k) => (e.ranks?.[k] ? `#${e.ranks[k]}` : "");
  return `<div class="eff-chips"><span title="Offensive rating (points per 100 possessions)">${rk("ortg")} ORtg <b>${e.ortg}</b></span><span title="Defensive rating (lower is better)">${rk("drtg")} DRtg <b>${e.drtg}</b></span><span class="${e.net >= 0 ? "pos" : "neg"}">Net <b>${e.net > 0 ? "+" : ""}${e.net}</b></span><span>Pace <b>${e.pace}</b></span></div>`;
}

/* Game Center sheet: linescore header + Box Score / Team Stats / Play-by-Play; polls every 15s while live */
let openGame = null;
function openBox(id) {
  let data = null, side = 0, tab = "box", stop = null, err = null, sideSet = false;
  openGame = id;
  sheet.open({
    title: "Game Center",
    render(body) {
      if (err && !data) { body.innerHTML = `<div class="empty">Couldn’t load this game: ${esc(err)}</div>`; return; }
      if (!data) { body.innerHTML = `<div class="skeleton" style="height:9rem"></div><div class="skeleton" style="height:14rem;margin-top:.75rem"></div>`; return; }
      body.innerHTML = gameCenter(data, side, tab);
      body.querySelectorAll("[data-side]").forEach((b) => b.addEventListener("click", () => { side = +b.dataset.side; sheet.refresh(); }));
      body.querySelectorAll("[data-gtab]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.gtab; sheet.refresh(); }));
    },
    onClose() { stop?.(); openGame = null; },
  });
  stop = client.watch("summary", { id }, (d, meta) => {
    data = d; err = meta?.error || null;
    if (!sideSet) { const ai = d.teams.findIndex((t) => t.team.id === d.game.away?.id); side = ai >= 0 ? ai : 0; sideSet = true; }
    const g = d.game;
    sheet.setTitle(g.away && g.home ? `${g.away.abbr} @ ${g.home.abbr}` : "Game Center");
    if (sheet.isOpen && openGame === id) sheet.refresh();
  }, (e) => { err = e.message; if (sheet.isOpen && openGame === id) sheet.refresh(); });
}
function gameCenter(d, side, tab) {
  const g = d.game;
  const T = (t, cls) => t ? `<div class="box-team ${cls}">${teamLogo(t, { size: "2.75rem" })}<div><div class="sc">${t.score ?? "–"}</div><div class="ab">${esc(t.abbr)}</div></div></div>` : "<div></div>";
  let html = `<div class="box-head">${T(g.away, "away")}<div class="box-mid">${statusPill(g)}</div>${T(g.home, "home")}</div>`;
  if (eff) html += `<div class="eff-row">${effChips(g.away)}${effChips(g.home)}</div>`;
  const la = d.linescore?.away || [], lh = d.linescore?.home || [];
  const n = Math.max(4, la.length, lh.length);
  if (la.length || lh.length) {
    const head = Array.from({ length: n }, (_, i) => (i < 4 ? `Q${i + 1}` : n - 4 > 1 ? `OT${i - 3}` : "OT"));
    const line = (t, arr) => `<tr><td class="ls-t">${teamLogo(t, { size: "1.2rem" })}${esc(t.abbr)}</td>${head.map((_, i) => `<td>${arr[i] ?? "–"}</td>`).join("")}<td class="ls-tot">${t.score ?? "–"}</td></tr>`;
    html += `<div class="ls-wrap"><table class="ls"><thead><tr><th></th>${head.map((h) => `<th>${h}</th>`).join("")}<th>T</th></tr></thead><tbody>${line(g.away, la)}${line(g.home, lh)}</tbody></table></div>`;
  }
  html += `<div class="seg gc-tabs" role="tablist" style="--n:3"><span class="thumb" style="transform:translateX(${["box", "team", "pbp"].indexOf(tab) * 100}%)"></span>
    ${[["box", "Box Score"], ["team", "Team Stats"], ["pbp", "Play-by-Play"]].map(([k, l]) => `<button type="button" role="tab" data-gtab="${k}" aria-pressed="${tab === k}">${l}</button>`).join("")}</div>`;
  if (!d.teams.length) return html + `<div class="empty">The box score appears once the game tips off.</div>`;
  if (tab === "team") return html + teamStatsView(d);
  if (tab === "pbp") return html + playsView(d);
  const order = [d.teams.findIndex((t) => t.team.id === g.away?.id), d.teams.findIndex((t) => t.team.id === g.home?.id)].map((i, k) => (i >= 0 ? i : k));
  html += `<div class="seg box-seg" role="group" aria-label="Team" style="--n:2"><span class="thumb" style="transform:translateX(${order.indexOf(side) * 100}%)"></span>
    ${order.map((i) => `<button type="button" data-side="${i}" aria-pressed="${i === side}">${esc(d.teams[i].team.displayName)}</button>`).join("")}</div>`;
  const tm = d.teams[side] || d.teams[0];
  const cols = ["MIN", "PTS", "REB", "AST", "STL", "BLK", "FG", "3PT", "+/-"].filter((c) => tm.labels.includes(c));
  const played = tm.players.filter((p) => !p.didNotPlay);
  const dnp = tm.players.filter((p) => p.didNotPlay);
  const rowFor = (p, i) => `<tr${i === 5 ? ' class="cut"' : ""}><td><div class="who" data-player="${esc(p.id || "")}" role="button" tabindex="0">${avatar(p, { size: "2rem", color: tm.team.color })}
      <div><div class="nm">${esc(p.shortName)}${p.starter ? '<span class="starter-tag">S</span>' : ""}</div><div class="sub">${esc(p.position)}${p.jersey ? ` · #${esc(p.jersey)}` : ""}</div></div></div></td>
      ${cols.map((c) => { const v = p.stats[c] ?? ""; const cls = c === "+/-" ? (v.startsWith("+") && v !== "+0" ? "pos" : v.startsWith("-") ? "neg" : "") : ""; return `<td class="${cls}">${esc(v)}</td>`; }).join("")}</tr>`;
  html += `<div class="panel"><div class="scroll-x"><table><thead><tr><th>Player</th>${cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>
    ${played.map(rowFor).join("")}
    <tr><td><b>Team</b></td>${cols.map((c) => `<td><b>${esc(tm.totals[c] ?? "")}</b></td>`).join("")}</tr></tbody></table></div></div>`;
  if (dnp.length) html += `<div class="dnp">Did not play: ${dnp.map((p) => `${esc(p.shortName)}${p.reason ? ` (${esc(p.reason.toLowerCase())})` : ""}`).join(", ")}</div>`;
  return html;
}
function teamStatsView(d) {
  const g = d.game;
  const A = d.teamStats?.find((t) => t.homeAway === "away") || d.teamStats?.[0], H = d.teamStats?.find((t) => t.homeAway === "home") || d.teamStats?.[1];
  if (!A || !H) return `<div class="empty">Team stats appear once the game tips off.</div>`;
  const ROWS = [["Field Goal %", "fieldGoalPct", "fieldGoalsMade-fieldGoalsAttempted"], ["3-Point %", "threePointFieldGoalPct", "threePointFieldGoalsMade-threePointFieldGoalsAttempted"], ["Free Throw %", "freeThrowPct", "freeThrowsMade-freeThrowsAttempted"],
    ["Rebounds", "totalRebounds"], ["Assists", "assists"], ["Turnovers", "totalTurnovers", null, true], ["Fast Break Points", "fastBreakPoints"], ["Points in Paint", "pointsInPaint"], ["Steals", "steals"], ["Blocks", "blocks"]];
  const val = (T, key) => parseFloat(T.stats[key] ?? (key === "totalTurnovers" ? T.stats.turnovers : undefined));
  return `<div class="ts-head"><span>${teamLogo(g.away, { size: "1.5rem" })}${esc(g.away.abbr)}</span><span>${esc(g.home.abbr)}${teamLogo(g.home, { size: "1.5rem" })}</span></div>
    <div class="ts">${ROWS.map(([label, key, sub, lowerBetter]) => {
      const a = val(A, key), h = val(H, key);
      if (!Number.isFinite(a) && !Number.isFinite(h)) return "";
      const share = a + h > 0 ? a / (a + h) : 0.5;
      const aw = lowerBetter ? a < h : a > h, hw = lowerBetter ? h < a : h > a;
      return `<div class="ts-row"><span class="ts-v ${aw ? "win" : ""}">${Number.isFinite(a) ? a : "–"}${sub && A.stats[sub] ? `<small>${esc(A.stats[sub])}</small>` : ""}</span>
        <span class="ts-l">${label}<span class="ts-bar"><i style="width:${(share * 100).toFixed(1)}%;background:${g.away.color || "var(--accent)"}"></i><i style="width:${((1 - share) * 100).toFixed(1)}%;background:${g.home.color || "var(--label-3)"}"></i></span></span>
        <span class="ts-v ${hw ? "win" : ""}">${Number.isFinite(h) ? h : "–"}${sub && H.stats[sub] ? `<small>${esc(H.stats[sub])}</small>` : ""}</span></div>`;
    }).join("")}</div>`;
}
function playsView(d) {
  if (!d.plays.length) return `<div class="empty">No plays yet.</div>`;
  const logos = Object.fromEntries(d.teams.map((t) => [t.team.id, t.team]));
  const per = (p) => (p.period ? (p.period > 4 ? (p.period - 4 > 1 ? `OT${p.period - 4}` : "OT") : `Q${p.period}`) : "");
  return `<ul class="list plays">${d.plays.map((p) => `
    <li class="row${p.scoring ? " scoring" : ""}"><span class="pb-logo">${logos[p.teamId] ? teamLogo(logos[p.teamId], { size: "1.3rem" }) : ""}</span><span class="clk">${per(p)} ${esc(p.clock)}</span>
    <span class="txt">${esc(p.text)}</span><span class="scr">${p.awayScore ?? ""}–${p.homeScore ?? ""}</span></li>`).join("")}</ul>
    <p class="fine" style="margin-top:.5rem">Latest ${d.plays.length} of ${d.playCount} plays · refreshes every 15 seconds while live.</p>`;
}

/* LiveWire item → box score or detail sheet */
function openWireItem(it) {
  if (it.kind === "game" && it.gameId) return openBox(it.gameId);
  sheet.open({
    title: it.tag === "INJURY" ? "Injury report" : it.tag === "TRADE" ? "Trade" : "Transaction",
    render(body) {
      body.innerHTML = `<div class="wire-detail">
        <div class="row" style="padding:0 0 .5rem">${it.athlete ? avatar(it.athlete, { size: "3.5rem", color: it.team?.color }) : it.team ? teamLogo(it.team, { size: "3rem" }) : ""}
          <span class="meta"><span class="nm">${esc(it.athlete?.name || it.team?.displayName || "")}</span><span class="sub">${esc(it.team?.displayName || "")}${it.status ? ` · ${esc(it.status)}` : ""}</span></span></div>
        <p><b>${esc(it.headline)}</b></p>
        ${it.detail && it.detail !== it.team?.displayName ? `<p>${esc(it.detail)}</p>` : ""}
        <p class="meta">${it.time ? esc(new Date(it.time).toLocaleString([], { dateStyle: "medium", timeStyle: it.kind === "transaction" ? undefined : "short" })) : ""}${it.returnDate ? ` · est. return ${esc(fmtDay(it.returnDate + "T12:00"))}` : ""}</p>
      </div>`;
    },
  });
}

/* Standings */
function startStandings() {
  const el = $("#standings"); el.dataset.loaded = "";
  return client.watch("standings", {}, (s, meta) => {
    noteMeta(meta);
    const first = !el.dataset.loaded; el.dataset.loaded = "1";
    el.innerHTML = s.conferences.map((c) => `<section class="panel"><h3>${esc(c.name)}</h3>
      <p class="note">Seeds 1–6 make the playoffs; 7–10 go to the play-in.</p>
      <div class="scroll-x"><table><thead><tr><th>Team</th><th>W</th><th>L</th><th>Pct</th><th>GB</th><th>L10</th><th>Strk</th><th>Home</th><th>Away</th><th>Diff</th></tr></thead><tbody>
      ${c.teams.map((t, i) => `<tr${i === 6 || i === 10 ? ' class="cut"' : ""}>
        <td><div class="who" data-team-hub="${esc(t.team.abbr)}" role="button" tabindex="0"><span class="seed">${t.seed ?? i + 1}</span>${teamLogo(t.team, { size: "1.6rem" })}<span class="nm">${esc(t.team.name || t.team.displayName)}</span></div></td>
        <td>${t.wins}</td><td>${t.losses}</td><td>${esc(t.pctText)}</td><td>${esc(t.gb)}</td><td>${esc(t.lastTen)}</td><td>${esc(t.streak)}</td><td>${esc(t.home)}</td><td>${esc(t.road)}</td>
        <td class="${(t.diff ?? 0) > 0 ? "pos" : (t.diff ?? 0) < 0 ? "neg" : ""}">${t.diff == null ? "" : (t.diff > 0 ? "+" : "") + t.diff.toFixed(1)}</td></tr>`).join("")}
      </tbody></table></div></section>`).join("");
    if (first) el.querySelectorAll(".panel").forEach(springIn);
  }, (err) => noteError(err, el));
}

/* Injuries */
let injFilter = "all", injData = [];
const injThumb = new Spring(0, (x) => { $("#injFilter .thumb").style.transform = `translateX(${x * 100}%)`; }, 0.001);
function renderInjuries() {
  const el = $("#injuries");
  const q = $("#injSearch").value.trim().toLowerCase();
  const list = injData.filter((i) =>
    (injFilter === "all" || (injFilter === "other" ? !["Out", "Day-To-Day"].includes(i.status) : i.status === injFilter)) &&
    (!q || `${i.athlete.name} ${i.team.displayName} ${i.team.abbr}`.toLowerCase().includes(q)));
  if (!list.length) { el.innerHTML = `<div class="empty">No injuries match.</div>`; return; }
  const byTeam = new Map();
  list.forEach((i) => { const k = i.team.id || i.team.displayName; if (!byTeam.has(k)) byTeam.set(k, { team: i.team, items: [] }); byTeam.get(k).items.push(i); });
  el.innerHTML = [...byTeam.values()].sort((a, b) => a.team.displayName.localeCompare(b.team.displayName)).map(({ team, items }) => `
    <section class="group"><div class="group-head" data-team-hub="${esc(team.abbr)}" role="button" tabindex="0">${teamLogo(team, { size: "1.75rem" })}${esc(team.displayName)}<span class="count">${items.length}</span></div>
    <ul class="list">${items.map((i) => `<li class="row inj">${avatar(i.athlete, { size: "2.75rem", color: team.color })}
      <span class="meta"><span class="nm">${esc(i.athlete.name)}</span>
        <span class="sub">${[i.athlete.position, i.injury, i.returnDate ? `est. return ${fmtDay(i.returnDate + "T12:00")}` : ""].filter(Boolean).map(esc).join(" · ")}</span>
        ${i.comment ? `<span class="cmt">${esc(i.comment)}</span>` : ""}</span>
      <span class="pill ${i.status === "Out" ? "out" : i.status === "Day-To-Day" ? "dtd" : ""}">${esc(i.status)}</span></li>`).join("")}</ul></section>`).join("");
}
function startInjuries() {
  const el = $("#injuries"); el.dataset.loaded = "";
  return client.watch("injuries", {}, (list, meta) => { noteMeta(meta); injData = list; el.dataset.loaded = "1"; renderInjuries(); }, (err) => noteError(err, el));
}
$("#injFilter").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  injFilter = b.dataset.f;
  const btns = [...$("#injFilter").querySelectorAll("button")];
  btns.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  injThumb.to(btns.indexOf(b), { damping: 1, response: 0.3 });
  renderInjuries();
});
$("#injSearch").addEventListener("input", renderInjuries);

/* Transactions */
const KIND = { trade: "Trade", release: "Waived", signing: "Signed", assignment: "Assigned", suspension: "Suspended", other: "Move" };
function startMoves() {
  const el = $("#moves"); el.dataset.loaded = "";
  return client.watch("transactions", {}, (list, meta) => {
    noteMeta(meta); el.dataset.loaded = "1";
    el.innerHTML = list.length ? list.map((t) => `<li class="row">${teamLogo(t.team, { size: "2.25rem" })}
      <span class="meta"><span class="when">${esc(fmtDay(t.date))} · ${esc(t.team.abbr)}</span><span class="desc">${esc(t.description)}</span></span>
      <span class="pill${t.kind === "trade" ? " live" : ""}">${KIND[t.kind] || "Move"}</span></li>`).join("") : `<li class="empty">No recent transactions.</li>`;
  }, (err) => noteError(err, el));
}

createClient().then((c) => {
  client = c;
  mountLedBoard($("#ledBoard"), { client, onGame: (id) => openBox(id) });
  renderLeaders();
  client.watch("players", {}, (d) => { leadersData = d; renderLeaders(); });
  client.watch("teamstats", {}, (d) => { eff = d.efficiency; });
  show(location.hash.slice(1) || "games", false);
  // LiveWire lives in the app shell; on this page, scores open the box score in place.
  shell.setWireHandler((it) => {
    if (it.kind === "game" && it.gameId) { shell.closeDrawer(); openBox(it.gameId); return true; }
    if (it.kind === "transaction") { shell.closeDrawer(); openWireItem(it); return true; }
    return false;                       // injuries → Player Quick-View (shell default)
  });
  const deep = new URLSearchParams(location.search).get("game");
  if (deep && /^\d+$/.test(deep)) openBox(deep);
  paintSync();
});
</script>
</body>
</html>
