<script>/* Privacy: purge pre-account history (the old global AI chat list and un-scoped trades, mock drafts and ballots). Personal work is now stored per user (ui/scoped.js); guests keep nothing. */(function(){var R=/^(hooptrax_ai_threads|hooptrax_ai_active|chat:v1|trade:workspace:v1|draft:v2:\d{4}|draft:simcount:\d{4}|awards:ballot|awards:ballot:v2|awards:picks)$/;[function(){return localStorage},function(){return sessionStorage}].forEach(function(f){try{var s=f();for(var i=s.length-1;i>=0;i--){var k=s.key(i);if(k&&R.test(k))s.removeItem(k)}}catch(e){}})})();</script>
<script>/* theme before first paint: dark default, light optional (localStorage "htx:theme") */(function(){var t="dark";try{t=localStorage.getItem("htx:theme")==="light"?"light":"dark"}catch(e){}document.documentElement.setAttribute("data-theme",t);var c=t==="light"?"#F8FAFC":"#0B0E14";document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute("content",c)})})();</script>

<body>
<header class="bar" id="bar"></header>
<main class="hub-page archive">
  <h1 class="large-title">Archive</h1>
  <div class="ref-search">
    <label class="ref-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <input id="refQ" type="search" enterkeyhint="search" placeholder="Search any player, coach, GM, or owner..." autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Search the NBA archive" />
      <button class="ref-clear" id="refClear" type="button" aria-label="Clear search" hidden>✕</button></label>
    <div class="ref-filters" role="tablist" aria-label="Filter">
      <button type="button" role="tab" data-role="" aria-selected="true">All</button><button type="button" role="tab" data-role="player" aria-selected="false">Players</button><button type="button" role="tab" data-role="coach" aria-selected="false">Coaches</button><button type="button" role="tab" data-role="exec" aria-selected="false">Front Office</button><button type="button" role="tab" data-role="owner" aria-selected="false">Owners</button>
    </div>
  </div>
  <nav class="ref-links" aria-label="Browse the archive">
    <button class="press" type="button" data-browse="leaders">All-Time Leaders</button><button class="press" type="button" data-browse="awards">Champions &amp; Awards</button><button class="press" type="button" data-browse="retired">Retired Jerseys</button>
  </nav>
  <ul class="list enc-results ref-results" id="refResults" hidden></ul>
  <section id="refDir" aria-live="polite"></section>
</main>
<script src="data.js"></script>
<script type="module">
import { mountShell } from "./ui/shell.js";
import { resultRow } from "./ui/encyclopedia.js";
import { renderHistory } from "./ui/history.js";
import { createSheet } from "./ui/motion.js";
import { sget, sset, sdel } from "./ui/scoped.js";
const shell = mountShell({ active: "archive" });
const sheet = createSheet();
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ESPN = { GSW: "gs", NOP: "no", NYK: "ny", SAS: "sa", UTA: "utah", WAS: "wsh" };
const logo = (code) => `https://a.espncdn.com/i/teamlogos/nba/500/${ESPN[code] || String(code).toLowerCase()}.png`;
const ROLE_WORD = { player: "players", coach: "coaches", exec: "front-office executives", owner: "owners" };
const params = new URLSearchParams(location.search);
let role = ["player", "coach", "exec", "owner"].includes(params.get("role")) ? params.get("role") : "", seq = 0, t = 0;

/* ---------- search ---------- */
const q = $("#refQ"), clear = $("#refClear"), res = $("#refResults"), dir = $("#refDir");
let wikiMod = null;
const browserWiki = (term, r) => (wikiMod ||= import("./service/wiki.js")).then((m) => m.wikiLookup(term, { role: r })).catch(() => []);
async function search() {
  const term = q.value.trim();
  clear.hidden = !term;
  if (term.length < 2) { res.hidden = true; dir.hidden = false; if (!role || role === "player") renderDir(); return; }
  res.hidden = false; dir.hidden = true;
  const my = ++seq;
  res.innerHTML = `<li class="empty">Searching…</li>`;
  try {
    const r = await fetch(`/api/players/search?q=${encodeURIComponent(term)}${role ? `&role=${role}` : ""}`); const j = await r.json();
    if (my !== seq) return;
    let list = j.data?.players || [];
    const knownPerson = list.some((p) => p.kind === "person" || p.kind === "wiki" || String(p.name).toLowerCase() === term.toLowerCase());
    // the server's Wikipedia lookup can be rate-limited; ask Wikipedia from the browser before giving up
    if ((role && role !== "player" && !list.length) || (!role && !knownPerson && list.length < 3)) {
      res.innerHTML = list.map(resultRow).join("") + `<li class="empty">Checking Wikipedia…</li>`;
      const names = new Set(list.map((p) => String(p.name).toLowerCase()));
      const extra = (await browserWiki(term, role && role !== "player" ? role : null)).filter((c) => (role ? true : c.role !== "player") && !names.has(c.name.toLowerCase()));
      if (my !== seq) return;
      list = [...list, ...extra];
    }
    res.innerHTML = list.length ? list.map(resultRow).join("") : `<li class="empty">No ${role ? ROLE_WORD[role] : "one"} matching “${esc(term)}” in the archive, ESPN or Wikipedia.</li>`;
  } catch { if (my === seq) res.innerHTML = `<li class="empty">Search is unavailable right now.</li>`; }
}
q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(search, 160); });
q.addEventListener("keydown", (e) => { if (e.key === "Escape" && q.value) { q.value = ""; search(); } });
clear.addEventListener("click", () => { q.value = ""; search(); q.focus(); });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== q && !sheet.isOpen && !/input|textarea|select/i.test(document.activeElement?.tagName || "")) { e.preventDefault(); q.focus(); } });
function setRole(r) {
  role = r;
  document.querySelectorAll(".ref-filters [data-role]").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.role === r)));
  const u = new URL(location.href); r ? u.searchParams.set("role", r) : u.searchParams.delete("role"); history.replaceState(null, "", u);
  renderDir(); search();
}
document.querySelectorAll(".ref-filters [data-role]").forEach((b) => b.addEventListener("click", () => setRole(b.dataset.role)));

/* ---------- directory below the search ---------- */
let officesP = null;
/* recent searches: profiles the viewer opened from search (per account; guests keep them for this visit only) */
const TRY = ["LeBron James", "Gregg Popovich", "Sam Presti", "Steve Ballmer"];
const RKEY = "archive:recent";
const recent = () => { try { const v = JSON.parse(sget(RKEY) || "[]"); return Array.isArray(v) ? v.slice(0, 8) : []; } catch { return []; } };
function remember(item) {
  if (!item?.name) return;
  const list = [item, ...recent().filter((x) => !(x.kind === item.kind && x.id === item.id))].slice(0, 8);
  sset(RKEY, JSON.stringify(list));
}
const offices = () => (officesP ||= fetch("/api/front-offices").then((r) => r.json()).then((j) => j.data).catch(() => { officesP = null; return null; }));
const face = (src, name) => `<span class="dir-face">${src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<span>${esc(String(name).split(" ").map((w) => w[0]).slice(0, 2).join(""))}</span></span>`;
const sk = (n) => `<ul class="dir-list">${Array.from({ length: n }, () => `<li class="dir-row"><span class="sk" style="width:2.5rem;height:2.5rem;border-radius:99px"></span><span class="sk" style="height:1rem;flex:1"></span></li>`).join("")}</ul>`;
async function renderDir() {
  const r = role;
  if (!r || r === "player") {          // calm, search-first landing: recent searches (or a few quick tries), then whitespace
    const rec = recent();
    dir.innerHTML = rec.length
      ? `<div class="spot-h"><h2 class="group-h">Recent Searches</h2><button class="link spot-clear" type="button" data-recent-clear>Clear</button></div>
         <div class="spot-chips">${rec.map((x, i) => `<button class="press" type="button" data-recent="${i}">${esc(x.name)}</button>`).join("")}</div>`
      : `<h2 class="group-h">Try</h2><div class="spot-chips">${TRY.map((n) => `<button class="press" type="button" data-try="${esc(n)}">${esc(n)}</button>`).join("")}</div>`;
    return;
  }
  const TITLE = { coach: "Head Coaches", exec: "Front Offices", owner: "Owners & Governors" };
  dir.innerHTML = `<h2 class="group-h">${TITLE[r]} · all 30 teams</h2>${sk(8)}`;
  const d = await offices(); if (role !== r) return;
  if (!d) { dir.innerHTML = `<p class="empty">The directory is unavailable right now. Search still works.</p>`; return; }
  const rows = [];
  for (const tm of d.teams) {
    const rec = tm.record ? `${tm.record.w}–${tm.record.l}` : "";
    if (r === "coach" && tm.coach) rows.push({ tm, x: tm.coach, title: tm.coach.since ? `Head Coach since ${tm.coach.since}` : "Head Coach", right: rec, rightSub: rec ? "this season" : "" });
    if (r === "exec") for (const x of [tm.president, tm.gm]) if (x) rows.push({ tm, x, title: x.title || "Basketball Operations", right: x.since ? `${x.since}` : "", rightSub: x.since ? "since" : "" });
    if (r === "owner" && tm.owner) rows.push({ tm, x: tm.owner, title: "Owner / Governor", right: tm.owner.since ? `${tm.owner.since}` : "", rightSub: tm.owner.since ? "since" : "" });
  }
  dir.innerHTML = `<h2 class="group-h">${TITLE[r]} · all 30 teams</h2>
    <ul class="dir-list">${rows.map(({ tm, x, title, right, rightSub }) => `<li><button class="dir-row press" type="button" ${x.person ? `data-person="${esc(x.person)}" data-role-pref="${r}"` : "disabled"}>
      <img class="dir-logo" src="${esc(tm.logo || logo(tm.team))}" alt="" width="36" height="36" loading="lazy" referrerpolicy="no-referrer">
      <span class="dir-who"><b>${esc(x.name)}</b><small>${esc(title)} · ${esc(tm.name)}</small></span>
      ${right ? `<span class="dir-stat"><b>${esc(right)}</b><small>${esc(rightSub)}</small></span>` : ""}<span class="chev" aria-hidden="true">›</span></button></li>`).join("")}</ul>
    <p class="enc-note">${r === "coach" ? "Head coaches and team records are live from ESPN." : `Checked against current reporting, ${esc(d.asOf ? new Date(d.asOf + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "this season")}. Tap anyone for their profile.`}</p>`;
}

/* ---------- taps ---------- */
document.addEventListener("click", (e) => {
  if (e.target.closest(".sheet")) return;
  const fromSearch = !!e.target.closest("#refResults");
  const nameOf = (el) => el.querySelector(".nm, .dir-who b")?.textContent.trim() || "";
  const p = e.target.closest("main [data-enc]"); if (p) { if (fromSearch) remember({ kind: "player", id: p.dataset.enc, name: nameOf(p) }); shell.encyclopedia.openProfile(p.dataset.enc); return; }
  const x = e.target.closest("main [data-person]"); if (x) { if (fromSearch) remember({ kind: "person", id: x.dataset.person, name: nameOf(x) }); shell.encyclopedia.openPerson(x.dataset.person, { role: x.dataset.rolePref || null }); return; }
  const w = e.target.closest("main [data-wiki]"); if (w) { if (fromSearch) remember({ kind: "query", id: q.value.trim().toLowerCase(), name: nameOf(w), q: q.value.trim() }); shell.encyclopedia.openWiki(w.dataset.wiki); return; }
  const rc = e.target.closest("[data-recent]");
  if (rc) { const it = recent()[+rc.dataset.recent]; if (!it) return;
    remember(it); renderDir();
    if (it.kind === "player") shell.encyclopedia.openProfile(it.id); else if (it.kind === "person") shell.encyclopedia.openPerson(it.id); else { q.value = it.q || it.name; search(); }
    return; }
  if (e.target.closest("[data-recent-clear]")) { sdel(RKEY); renderDir(); return; }
  const tr = e.target.closest("[data-try]"); if (tr) { q.value = tr.dataset.try; search(); q.focus({ preventScroll: true }); return; }
  const b = e.target.closest("main [data-browse]"); if (b) browseOpen(b.dataset.browse);
});
let historyP = null;
const historyData = () => (historyP ||= fetch("nba_history.json").then((r) => r.json()));
async function browseOpen(kind) {
  if (kind === "leaders" || kind === "awards") {
    sheet.open({ title: kind === "leaders" ? "All-Time Leaders" : "Champions & Awards", render(body) { body.classList.add("ref-sheet"); renderHistory(body, { history: null }); } });
    const h = await historyData(); if (sheet.isOpen) renderHistory(sheet.body, { history: h, tab: kind });
    return;
  }
  if (kind === "retired") {
    const h = await historyData();
    const names = window.NBA_DATA?.teams || {};
    sheet.open({ title: "Retired Jerseys", render(body) {
      body.innerHTML = `<p class="enc-note" style="margin-top:0">League-wide: #6 Bill Russell (2022). Audited against team announcements, Nov 2026.</p><ul class="pp-list">${Object.entries(h.franchises).sort((a, b) => a[0].localeCompare(b[0])).map(([code, f]) => `<li class="pp-row rj"><img src="${logo(code)}" alt="" width="28" height="28" loading="lazy" referrerpolicy="no-referrer"><span class="pp-who"><b>${esc(names[code] ? `${names[code].city} ${names[code].name}` : code)}</b><small>${f.retired.map((r) => `#${esc(r.num)} ${esc(r.name)}`).join(" · ") || "No retired numbers"}${(f.upcomingRetirements || []).length ? ` <span class="up">· Coming: ${f.upcomingRetirements.map((u) => `#${esc(u.num)} ${esc(u.name)} (${esc(u.date)})`).join(", ")}</span>` : ""}</small></span><button class="link" type="button" data-team-hub="${code}">Vault ›</button></li>`).join("")}</ul>`;
    } });
  }
}

/* ---------- start ---------- */
if (params.get("q")) q.value = params.get("q");
setRole(role);
// Spotlight-style: ready to type on desktop (phones keep the keyboard down until the field is tapped)
if (matchMedia("(pointer: fine)").matches && !params.has("nofocus")) q.focus({ preventScroll: true });
</script>
</body>
</html>
