<body>
<header class="bar" id="bar"></header>
<main class="hub-page archive is-hero">
  <div class="arch-top">
  <h1 class="large-title">Archive</h1>
  <p class="arch-sub">Every player, coach, GM &amp; owner since 1946</p>
  <div class="ref-search">
    <label class="ref-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <input id="refQ" type="search" enterkeyhint="search" placeholder="Search players, coaches, GMs, owners..." autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Search the NBA archive" />
      <button class="ref-clear" id="refClear" type="button" aria-label="Clear search" hidden>✕</button></label>
    <div class="ref-filters" role="tablist" aria-label="Filter">
      <button type="button" role="tab" data-role="" aria-selected="true">All</button><button type="button" role="tab" data-role="player" aria-selected="false">Players</button><button type="button" role="tab" data-role="coach" aria-selected="false">Coaches</button><button type="button" role="tab" data-role="exec" aria-selected="false">Front Office</button><button type="button" role="tab" data-role="owner" aria-selected="false">Owners</button>
    </div>
  </div>
  <div class="arch-quick" id="archQuick"></div>
  <nav class="arch-links" aria-label="Browse the archive">
    <button type="button" data-browse="leaders">All-Time Leaders</button><button type="button" data-browse="awards">Champions &amp; Awards</button><button type="button" data-browse="retired">Retired Jerseys</button><button type="button" data-browse="draft">Draft History</button>
  </nav>
  </div>
  <ul class="list enc-results ref-results" id="refResults" hidden></ul>
  <section id="refDir" aria-live="polite"></section>
</main>
<script src="data.js"></script>
<script type="module">
import { mountShell } from "./ui/shell.js";
import { resultRow } from "./ui/encyclopedia.js";
import { renderHistory } from "./ui/history.js";
import { createSheet } from "./ui/motion.js";
import { sget, sset, sdel } from "./ui/scoped.js";
const shell = mountShell({ active: "archive" });
const sheet = createSheet();
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ESPN = { GSW: "gs", NOP: "no", NYK: "ny", SAS: "sa", UTA: "utah", WAS: "wsh" };
const logo = (code) => `https://a.espncdn.com/i/teamlogos/nba/500/${ESPN[code] || String(code).toLowerCase()}.png`;
const ROLE_WORD = { player: "players", coach: "coaches", exec: "front-office executives", owner: "owners" };
const params = new URLSearchParams(location.search);
let role = ["player", "coach", "exec", "owner"].includes(params.get("role")) ? params.get("role") : "", seq = 0, t = 0;

/* ---------- search ---------- */
const q = $("#refQ"), clear = $("#refClear"), res = $("#refResults"), dir = $("#refDir");
let wikiMod = null;
const browserWiki = (term, r) => (wikiMod ||= import("./service/wiki.js")).then((m) => m.wikiLookup(term, { role: r })).catch(() => []);
const main = document.querySelector("main.archive");
/** Hero (centered Spotlight) while nothing is typed on All/Players; docked to the top otherwise. */
function updateMode() {
  const hero = q.value.trim().length < 2 && !role;
  if (main.classList.contains("is-hero") === hero) return;
  main.classList.toggle("is-hero", hero);
  if (!hero) window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
async function search() {
  const term = q.value.trim();
  updateMode();
  if (role === "player") {                 // Players: the search box filters the directory (first 25, then Show More)
    clear.hidden = !term; res.hidden = true; dir.hidden = false;
    const next = term.length >= 2 ? term : "";
    if (next !== PD.q || !$("#pdList")) { PD.q = next; PD.letter = null; if ($("#pdList")) pdLoad({ reset: true }); }
    return;
  }
  clear.hidden = !term;
  if (term.length < 2) { res.hidden = true; dir.hidden = false; if (!role) renderDir(); return; }
  res.hidden = false; dir.hidden = true;
  const my = ++seq;
  res.innerHTML = `<li class="empty">Searching…</li>`;
  try {
    const r = await fetch(`/api/players/search?q=${encodeURIComponent(term)}${role ? `&role=${role}` : ""}`); const j = await r.json();
    if (my !== seq) return;
    let list = j.data?.players || [];
    const knownPerson = list.some((p) => p.kind === "person" || p.kind === "wiki" || String(p.name).toLowerCase() === term.toLowerCase());
    // the server's Wikipedia lookup can be rate-limited; ask Wikipedia from the browser before giving up
    if ((role && role !== "player" && !list.length) || (!role && !knownPerson && list.length < 3)) {
      res.innerHTML = list.map(resultRow).join("") + `<li class="empty">Checking Wikipedia…</li>`;
      const names = new Set(list.map((p) => String(p.name).toLowerCase()));
      const extra = (await browserWiki(term, role && role !== "player" ? role : null)).filter((c) => (role ? true : c.role !== "player") && !names.has(c.name.toLowerCase()));
      if (my !== seq) return;
      list = [...list, ...extra];
    }
    res.innerHTML = list.length ? list.map(resultRow).join("") : `<li class="empty">No ${role ? ROLE_WORD[role] : "one"} matching “${esc(term)}” in the archive, ESPN or Wikipedia.</li>`;
  } catch { if (my === seq) res.innerHTML = `<li class="empty">Search is unavailable right now.</li>`; }
}
q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(search, 160); });
q.addEventListener("keydown", (e) => { if (e.key === "Escape" && q.value) { q.value = ""; search(); } });
clear.addEventListener("click", () => { q.value = ""; search(); q.focus(); });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== q && !sheet.isOpen && !/input|textarea|select/i.test(document.activeElement?.tagName || "")) { e.preventDefault(); q.focus(); } });
function setRole(r) {
  role = r;
  document.querySelectorAll(".ref-filters [data-role]").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.role === r)));
  const u = new URL(location.href); r ? u.searchParams.set("role", r) : u.searchParams.delete("role"); history.replaceState(null, "", u);
  if (r === "player") { const t = q.value.trim(); PD.q = t.length >= 2 ? t : ""; PD.letter = null; }
  updateMode(); renderDir(); search();
}
document.querySelectorAll(".ref-filters [data-role]").forEach((b) => b.addEventListener("click", () => setRole(b.dataset.role)));

/* ---------- directory below the search ---------- */
let officesP = null;
/* recent searches: profiles the viewer opened from search (per account; guests keep them for this visit only) */
const TRY = ["LeBron James", "Gregg Popovich", "Sam Presti", "Steve Ballmer"];
const RKEY = "archive:recent";
const recent = () => { try { const v = JSON.parse(sget(RKEY) || "[]"); return Array.isArray(v) ? v.slice(0, 8) : []; } catch { return []; } };
function remember(item) {
  if (!item?.name) return;
  const list = [item, ...recent().filter((x) => !(x.kind === item.kind && x.id === item.id))].slice(0, 8);
  sset(RKEY, JSON.stringify(list));
}
const offices = () => (officesP ||= fetch("/api/front-offices").then((r) => r.json()).then((j) => j.data).catch(() => { officesP = null; return null; }));
const face = (src, name) => `<span class="dir-face">${src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<span>${esc(String(name).split(" ").map((w) => w[0]).slice(0, 2).join(""))}</span></span>`;
const sk = (n) => `<ul class="dir-list">${Array.from({ length: n }, () => `<li class="dir-row"><span class="sk" style="width:2.5rem;height:2.5rem;border-radius:99px"></span><span class="sk" style="height:1rem;flex:1"></span></li>`).join("")}</ul>`;
/* ---------- Players: every NBA/ABA/BAA player in one A–Z directory, 25 at a time with "Show More" ---------- */
const PD_FILTERS = [["all", "All"], ["active", "Active"], ["hof", "Hall of Fame"], ["top75", "Top 75"], ["G", "G"], ["F", "F"], ["C", "C"]];
const PAGE = 25;
const PD = { filter: "all", q: "", letter: null, base: 0, loaded: 0, total: 0, seq: 0, loading: false };
const HOF_TAG = { player: ["HOF", "Naismith Hall of Fame"], coach: ["HOF coach", "Hall of Fame (inducted as a coach)"], contributor: ["HOF contrib.", "Hall of Fame (inducted as a contributor)"] };
// headshot: NBA.com CDN first, then ESPN, then the initials badge underneath
const pdFace = (p) => `<span class="dir-face">${p.headshot ? `<img src="${esc(p.headshot)}" ${p.alt ? `data-alt="${esc(p.alt)}"` : ""} alt="" loading="lazy" referrerpolicy="no-referrer" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.removeAttribute('data-alt')}else this.remove()">` : ""}<span>${esc(String(p.name).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase())}</span></span>`;
const pdRow = (p) => `<li><button class="dir-row press" type="button" ${p.id.startsWith("h:") ? `data-hist="${esc(p.id.slice(2))}" data-name="${esc(p.name)}" data-years="${esc(p.years)}" data-pos="${esc(p.pos)}" data-lg="${esc(p.lg || "")}" data-hof="${esc(p.hofRole || "")}"` : `data-enc="${esc(p.id)}"`}>${pdFace(p)}
  <span class="dir-who"><b>${esc(p.name)}</b><small>${p.active ? `${p.team ? `<img class="dir-badge" src="${esc(logo(p.team))}" alt="" width="16" height="16" loading="lazy" referrerpolicy="no-referrer">${esc(p.team)} · ` : ""}Active` : esc(p.years || "")}${p.pos ? ` · ${esc(p.pos)}` : ""}${p.lg && p.lg !== "NBA" && !p.active ? ` · ${esc(p.lg.replace("/", " / "))}` : ""}</small></span>
  <span class="pd-tags">${p.hofRole ? `<span class="pd-tag hof${p.hofRole !== "player" ? " role" : ""}" title="${HOF_TAG[p.hofRole][1]}">${HOF_TAG[p.hofRole][0]}</span>` : ""}${p.top75 ? '<span class="pd-tag t75" title="NBA 75th Anniversary Team">75</span>' : ""}</span></button></li>`;
function renderPlayerDir() {
  $("#archQuick").innerHTML = "";
  dir.innerHTML = `<div class="pd-bar">
      <div class="pd-filters" role="tablist" aria-label="Filter players">${PD_FILTERS.map(([k, l]) => `<button type="button" role="tab" data-pdf="${k}" aria-selected="${k === PD.filter}">${l}</button>`).join("")}</div>
      <nav class="pd-letters" aria-label="Jump to letter">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map((L) => `<button type="button" data-pdl="${L}" aria-pressed="${L === PD.letter}">${L}</button>`).join("")}</nav>
    </div>
    <p class="pd-count" id="pdCount"></p>
    <ul class="dir-list pd-list" id="pdList">${Array.from({ length: 6 }, () => `<li class="dir-row"><span class="sk" style="width:2.5rem;height:2.5rem;border-radius:99px"></span><span class="sk" style="height:1rem;flex:1"></span></li>`).join("")}</ul>
    <button class="pd-more press" type="button" id="pdMore" hidden></button>`;
  pdLoad({ reset: true });
}
/** reset: first 25 of the current filter / search / letter; otherwise append the next 25. */
async function pdLoad({ reset = false } = {}) {
  if (role !== "player") return;
  if (!reset && (PD.loading || PD.base + PD.loaded >= PD.total)) return;
  const my = reset ? ++PD.seq : PD.seq;
  PD.loading = true;
  const qs = new URLSearchParams({ filter: PD.filter, limit: String(PAGE) });
  if (PD.q) qs.set("q", PD.q);
  if (reset && PD.letter) qs.set("letter", PD.letter); else qs.set("offset", reset ? "0" : String(PD.base + PD.loaded));
  const more = $("#pdMore"); if (more && !reset) { more.disabled = true; more.classList.add("busy"); }
  try {
    const d = (await fetch(`/api/players/directory?${qs}`).then((r) => r.json())).data;
    if (my !== PD.seq || role !== "player") return;
    const list = $("#pdList"); if (!list) return;
    if (reset) { PD.base = d.offset; PD.loaded = 0; PD.total = d.total; list.innerHTML = ""; }
    PD.loaded += d.players.length;
    list.insertAdjacentHTML("beforeend", d.players.map(pdRow).join("") || (reset ? `<li class="empty">No players match${PD.q ? ` “${esc(PD.q)}”` : ""}.</li>` : ""));
    const avail = PD.total - PD.base, n = (x) => x.toLocaleString("en-US");
    $("#pdCount").textContent = `${n(PD.total)} players${PD.q ? ` matching “${PD.q}”` : ""} · A–Z by last name${PD.letter ? ` · from ${PD.letter}` : ""}`;
    document.querySelectorAll("[data-pdl]").forEach((b) => { b.disabled = d.letters[b.dataset.pdl] == null; b.setAttribute("aria-pressed", String(b.dataset.pdl === PD.letter)); });
    if (more) {
      more.hidden = PD.loaded >= avail;
      more.innerHTML = `<span>Show More <small>(Showing ${n(PD.loaded)} of ${n(avail)}${PD.letter ? ` from ${PD.letter}` : ""})</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }
  } catch { if (my === PD.seq) $("#pdCount").textContent = "The directory is unavailable right now."; }
  finally { if (my === PD.seq) { PD.loading = false; if (more) { more.disabled = false; more.classList.remove("busy"); } } }
}
document.addEventListener("click", async (e) => {
  const f = e.target.closest("[data-pdf]");
  if (f) { PD.filter = f.dataset.pdf; PD.letter = null; document.querySelectorAll("[data-pdf]").forEach((x) => x.setAttribute("aria-selected", String(x === f))); pdLoad({ reset: true }); return; }
  const L = e.target.closest("[data-pdl]");
  if (L && !L.disabled) { PD.letter = PD.letter === L.dataset.pdl ? null : L.dataset.pdl; PD.loading = false; pdLoad({ reset: true }); return; }
  if (e.target.closest("#pdMore")) { pdLoad(); return; }
  const h = e.target.closest("[data-hist]");
  if (h) {      // a player only the historical index knows: find his ESPN profile by name, else show what the index has
    const { name, years, pos, lg, hof } = h.dataset;
    const r = await fetch(`/api/players/resolve?name=${encodeURIComponent(name)}`).then((x) => (x.ok ? x.json() : null)).catch(() => null);
    if (r?.data?.id) { remember({ kind: "player", id: r.data.id, name }); shell.encyclopedia.openProfile(r.data.id); return; }
    sheet.open({ title: "Profile", render(body) {
      body.innerHTML = `<div class="enc-hero"><div class="enc-face">${pdFace({ name })}</div><div class="enc-id"><h3>${esc(name)}</h3>
        <div class="enc-sub"><span class="enc-team">${esc(lg || "NBA")}</span>${pos ? `<span>${esc(pos)}</span>` : ""}</div></div></div>
        <div class="enc-facts">${years ? `<div class="enc-fact"><small>Career</small><b>${esc(years)}</b></div>` : ""}${hof ? `<div class="enc-fact"><small>Hall of Fame</small><b>${hof === "player" ? "Inducted" : `As ${esc(hof)}`}</b></div>` : ""}</div>
        <p class="enc-note">ESPN has no stats profile for this player. Career years, position and league come from the historical player index.</p>`;
    } });
  }
});
async function renderDir() {
  const r = role;
  if (r === "player") { renderPlayerDir(); return; }
  if (!r) {          // centered Spotlight hero: 2×2 quick tiles (recent searches when there are any)
    dir.innerHTML = "";
    const rec = recent().slice(0, 4);
    $("#archQuick").innerHTML = rec.length
      ? `<div class="aq-h"><span>Recent</span><button class="link" type="button" data-recent-clear>Clear</button></div>${rec.map((x, i) => `<button class="press" type="button" data-recent="${i}">${esc(x.name)}</button>`).join("")}`
      : TRY.map((n) => `<button class="press" type="button" data-try="${esc(n)}">${esc(n)}</button>`).join("");
    return;
  }
  const TITLE = { coach: "Head Coaches", exec: "Front Offices", owner: "Owners & Governors" };
  dir.innerHTML = `<h2 class="group-h">${TITLE[r]} · all 30 teams</h2>${sk(8)}`;
  const d = await offices(); if (role !== r) return;
  if (!d) { dir.innerHTML = `<p class="empty">The directory is unavailable right now. Search still works.</p>`; return; }
  const rows = [];
  for (const tm of d.teams) {
    const rec = tm.record ? `${tm.record.w}–${tm.record.l}` : "";
    if (r === "coach" && tm.coach) rows.push({ tm, x: tm.coach, title: tm.coach.since ? `Head Coach since ${tm.coach.since}` : "Head Coach", right: rec, rightSub: rec ? "this season" : "" });
    if (r === "exec") for (const x of [tm.president, tm.gm]) if (x) rows.push({ tm, x, title: x.title || "Basketball Operations", right: x.since ? `${x.since}` : "", rightSub: x.since ? "since" : "" });
    if (r === "owner" && tm.owner) rows.push({ tm, x: tm.owner, title: "Owner / Governor", right: tm.owner.since ? `${tm.owner.since}` : "", rightSub: tm.owner.since ? "since" : "" });
  }
  dir.innerHTML = `<h2 class="group-h">${TITLE[r]} · all 30 teams</h2>
    <ul class="dir-list">${rows.map(({ tm, x, title, right, rightSub }) => `<li><button class="dir-row press" type="button" ${x.person ? `data-person="${esc(x.person)}" data-role-pref="${r}"` : "disabled"}>
      <img class="dir-logo" src="${esc(tm.logo || logo(tm.team))}" alt="" width="36" height="36" loading="lazy" referrerpolicy="no-referrer">
      <span class="dir-who"><b>${esc(x.name)}</b><small>${esc(title)} · ${esc(tm.name)}</small></span>
      ${right ? `<span class="dir-stat"><b>${esc(right)}</b><small>${esc(rightSub)}</small></span>` : ""}<span class="chev" aria-hidden="true">›</span></button></li>`).join("")}</ul>
    <p class="enc-note">${r === "coach" ? "Head coaches and team records are live from ESPN." : `Checked against current reporting, ${esc(d.asOf ? new Date(d.asOf + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "this season")}. Tap anyone for their profile.`}</p>`;
}

/* ---------- taps ---------- */
document.addEventListener("click", (e) => {
  if (e.target.closest(".sheet")) return;
  const fromSearch = !!e.target.closest("#refResults");
  const nameOf = (el) => el.querySelector(".nm, .dir-who b")?.textContent.trim() || "";
  const p = e.target.closest("main [data-enc]"); if (p) { if (fromSearch) remember({ kind: "player", id: p.dataset.enc, name: nameOf(p) }); shell.encyclopedia.openProfile(p.dataset.enc); return; }
  const x = e.target.closest("main [data-person]"); if (x) { if (fromSearch) remember({ kind: "person", id: x.dataset.person, name: nameOf(x) }); shell.encyclopedia.openPerson(x.dataset.person, { role: x.dataset.rolePref || null }); return; }
  const w = e.target.closest("main [data-wiki]"); if (w) { if (fromSearch) remember({ kind: "query", id: q.value.trim().toLowerCase(), name: nameOf(w), q: q.value.trim() }); shell.encyclopedia.openWiki(w.dataset.wiki); return; }
  const rc = e.target.closest("[data-recent]");
  if (rc) { const it = recent()[+rc.dataset.recent]; if (!it) return;
    remember(it); renderDir();
    if (it.kind === "player") shell.encyclopedia.openProfile(it.id); else if (it.kind === "person") shell.encyclopedia.openPerson(it.id); else { q.value = it.q || it.name; search(); }
    return; }
  if (e.target.closest("[data-recent-clear]")) { sdel(RKEY); renderDir(); return; }
  const tr = e.target.closest("[data-try]"); if (tr) { q.value = tr.dataset.try; search(); q.focus({ preventScroll: true }); return; }
  const b = e.target.closest("main [data-browse]"); if (b) browseOpen(b.dataset.browse);
});
let historyP = null;
const historyData = () => (historyP ||= fetch("nba_history.json").then((r) => r.json()));
/** All four sections open the same sheet (same four tabs inside), on the tab that was tapped. */
async function browseOpen(kind) {
  const TITLE = { leaders: "All-Time Leaders", awards: "Champions & Awards", retired: "Retired Jerseys", draft: "Draft History" };
  if (!TITLE[kind]) return;
  sheet.open({ title: "NBA History", render(body) { body.classList.add("ref-sheet"); renderHistory(body, { history: null }); } });
  const h = await historyData(); if (sheet.isOpen) renderHistory(sheet.body, { history: h, tab: kind, cat: kind === "leaders" ? "pts" : null });
}

/* ---------- start ---------- */
if (params.get("q")) q.value = params.get("q");
setRole(role);
// Spotlight-style: ready to type on desktop (phones keep the keyboard down until the field is tapped)
if (matchMedia("(pointer: fine)").matches && !params.has("nofocus")) q.focus({ preventScroll: true });
</script>
